<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thầy Trung — Gia sư tiếng Trung</title>
<style>
  :root {
    --red: #c0392b;
    --gold: #d4a017;
    --bg: #f7f3ee;
    --bubble-user: #c0392b;
    --bubble-bot: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
    color: #222;
  }
  header {
    background: linear-gradient(135deg, var(--red), #8e2820);
    color: #fff;
    padding: 16px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header .avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--gold); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
  }
  header h1 { font-size: 18px; }
  header p { font-size: 13px; opacity: .85; margin-top: 2px; }
  #status { margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(255,255,255,.18); }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  .msg { display: flex; gap: 10px; max-width: 85%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .body {
    padding: 12px 16px; border-radius: 16px; line-height: 1.55;
    font-size: 15px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    word-wrap: break-word; overflow-wrap: anywhere;
  }
  .msg.bot .body { background: var(--bubble-bot); border-top-left-radius: 4px; }
  .msg.user .body { background: var(--bubble-user); color: #fff; border-top-right-radius: 4px; }
  .msg .body table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .msg .body th, .msg .body td { border: 1px solid #ddd; padding: 6px 10px; font-size: 14px; text-align: left; }
  .msg .body th { background: #f3e9d8; }
  .msg .body blockquote { border-left: 3px solid var(--gold); padding-left: 12px; margin: 8px 0; color: #555; }
  .msg .body code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  .msg .body h2, .msg .body h3 { margin: 10px 0 6px; }
  .msg .body ul, .msg .body ol { margin: 6px 0 6px 20px; }
  .msg .body hr { border: none; border-top: 1px solid #eee; margin: 10px 0; }
  .typing { font-style: italic; color: #888; }
  /* Chữ Hán có thể click nghe phát âm */
  .hanzi {
    color: var(--red); font-weight: 600; cursor: pointer;
    border-bottom: 1px dotted var(--red); padding: 0 1px;
    transition: background .15s;
  }
  .hanzi:hover { background: #fbeae8; }
  .hanzi.speaking { background: var(--gold); color: #fff; border-radius: 3px; }
  .spk-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; margin-left: 2px; vertical-align: middle;
    border: none; background: transparent; cursor: pointer; opacity: .55;
    font-size: 13px; line-height: 1;
  }
  .spk-btn:hover { opacity: 1; }
  .audio-hint { font-size: 11px; color: #aaa; margin-left: 6px; }
  footer {
    padding: 14px 20px; background: #fff; border-top: 1px solid #e5e0d8;
  }
  .inputbar { display: flex; gap: 10px; max-width: 820px; margin: 0 auto; }
  #input {
    flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px;
    font-size: 15px; outline: none; font-family: inherit;
  }
  #input:focus { border-color: var(--red); }
  #send {
    background: var(--red); color: #fff; border: none; border-radius: 24px;
    padding: 0 24px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: not-allowed; }
  .hint { text-align: center; font-size: 12px; color: #999; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <div class="avatar">中</div>
    <div>
      <h1>Thầy Trung</h1>
      <p>Gia sư tiếng Trung cho người Việt</p>
    </div>
    <span id="status">● đang kết nối…</span>
  </header>

  <div id="chat"></div>

  <footer>
    <div class="inputbar">
      <input id="input" type="text" placeholder="Nhắn tin cho Thầy Trung… (vd: Tôi muốn học tiếng Trung từ đầu)" autocomplete="off">
      <button id="send">Gửi</button>
    </div>
    <div class="hint">Chạy local · http://localhost:3000</div>
  </footer>

<script>
const API = "/invocations";
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const statusEl = document.getElementById("status");
let history = [];

/* ===== PHÁT ÂM (Web Speech API — trình duyệt tự đọc giọng zh-CN) ===== */
const speech = {
  supported: "speechSynthesis" in window,
  voice: null,
  pickVoice() {
    if (!this.supported) return;
    const vs = window.speechSynthesis.getVoices();
    // ưu tiên giọng tiếng Trung đại lục
    this.voice = vs.find(v => /zh[-_]?CN/i.test(v.lang))
      || vs.find(v => /^zh/i.test(v.lang))
      || vs.find(v => /chinese|中文|普通话/i.test(v.name))
      || null;
  },
  speak(text, el) {
    if (!this.supported) { alert("Trình duyệt không hỗ trợ phát âm. Hãy dùng Chrome/Edge/Safari."); return; }
    window.speechSynthesis.cancel();           // dừng câu đang đọc
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    if (this.voice) u.voice = this.voice;
    u.rate = 0.85;                              // chậm lại cho người học
    if (el) {
      el.classList.add("speaking");
      u.onend = u.onerror = () => el.classList.remove("speaking");
    }
    window.speechSynthesis.speak(u);
  }
};
if (speech.supported) {
  speech.pickVoice();
  window.speechSynthesis.onvoiceschanged = () => speech.pickVoice();
}
// click chữ Hán → đọc
chat.addEventListener("click", e => {
  const el = e.target.closest(".hanzi");
  if (el) speech.speak(el.dataset.cn, el);
});

// Minimal markdown → HTML (tables, bold, headings, blockquote, lists, code, hr)
function md(t) {
  t = t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // tables
  t = t.replace(/((?:^\|.*\|\s*$\n?)+)/gm, block => {
    const rows = block.trim().split("\n").map(r => r.trim());
    if (rows.length < 2) return block;
    const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
    let html = "<table>";
    html += "<tr>" + cells(rows[0]).map(c=>`<th>${c}</th>`).join("") + "</tr>";
    for (let i=2;i<rows.length;i++) html += "<tr>" + cells(rows[i]).map(c=>`<td>${c}</td>`).join("") + "</tr>";
    return html + "</table>";
  });
  t = t.replace(/^### (.*)$/gm,"<h3>$1</h3>");
  t = t.replace(/^## (.*)$/gm,"<h2>$1</h2>");
  t = t.replace(/^> (.*)$/gm,"<blockquote>$1</blockquote>");
  t = t.replace(/^---$/gm,"<hr>");
  t = t.replace(/^\s*[-*] (.*)$/gm,"<li>$1</li>");
  t = t.replace(/(<li>[\s\S]*?<\/li>)/g,"<ul>$1</ul>");
  t = t.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  t = t.replace(/`(.+?)`/g,"<code>$1</code>");
  t = t.replace(/\n/g,"<br>");
  t = t.replace(/<br>(<(?:h2|h3|ul|table|blockquote|hr))/g,"$1");
  t = t.replace(/(<\/(?:h2|h3|ul|table|blockquote)>|<hr>)<br>/g,"$1");
  t = wrapHanzi(t);
  return t;
}

// Bọc mỗi cụm chữ Hán liên tiếp thành <span class="hanzi"> để click nghe.
// Bỏ qua text bên trong thẻ HTML (chỉ xử lý phần hiển thị).
const HANZI_RE = /[一-鿿㐀-䶿]+/g;
function wrapHanzi(html) {
  // tách theo thẻ HTML, chỉ thay phần text giữa các thẻ
  return html.replace(/(<[^>]+>)|([^<]+)/g, (m, tag, text) => {
    if (tag) return tag;                       // giữ nguyên thẻ
    return text.replace(HANZI_RE, h =>
      `<span class="hanzi" data-cn="${h}" title="Nhấn để nghe">${h}</span>`);
  });
}

function addMsg(role, text) {
  const m = document.createElement("div");
  m.className = "msg " + (role==="user"?"user":"bot");
  m.innerHTML = `<div class="body">${role==="user"? text.replace(/</g,"&lt;") : md(text)}</div>`;
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  return m;
}

async function ping() {
  try {
    const r = await fetch("/health");
    if (r.ok) { statusEl.textContent = "● online"; statusEl.style.background="rgba(46,204,113,.35)"; }
    else throw 0;
  } catch { statusEl.textContent = "● offline — server chưa chạy"; statusEl.style.background="rgba(0,0,0,.3)"; }
}

let busy = false;

async function sendMsg() {
  if (busy) return;                       // chặn gửi chồng khi đang chờ phản hồi
  const text = input.value.trim();
  if (!text) return;
  busy = true;
  addMsg("user", text);
  input.value = "";
  send.disabled = true;
  input.disabled = true;
  const typing = addMsg("bot", "Thầy Trung đang soạn câu trả lời…");
  typing.querySelector(".body").classList.add("typing");
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ message: text, history })
    });
    const data = await res.json();
    const reply = data.response || "(không có phản hồi)";
    typing.querySelector(".body").classList.remove("typing");
    typing.querySelector(".body").innerHTML = md(reply);
    history.push({role:"user", content:text});
    history.push({role:"assistant", content:reply});
  } catch (e) {
    typing.querySelector(".body").classList.remove("typing");
    typing.querySelector(".body").innerHTML = "⚠️ Lỗi kết nối server. Kiểm tra agent có đang chạy ở cổng 8080 không.";
  }
  busy = false;
  send.disabled = false;
  input.disabled = false;
  input.focus();
  chat.scrollTop = chat.scrollHeight;
}

send.onclick = sendMsg;
input.addEventListener("keydown", e => { if (e.key==="Enter" && !busy) sendMsg(); });

// greeting
const audioNote = speech.supported
  ? "\n\n🔊 *Mẹo: bấm vào chữ Hán màu đỏ (như 你好) để nghe phát âm.*"
  : "\n\n*(Trình duyệt này chưa hỗ trợ phát âm — dùng Chrome/Edge/Safari để nghe được.)*";
addMsg("bot", "Xin chào! 👋 Mình là **Thầy Trung** — gia sư tiếng Trung cho người Việt.\n\nMình dạy theo 5 phần: **Phiên âm (pinyin)** → **8 nét cơ bản** → **Bộ thủ** → **Học theo bài** → **Thơ ca**.\n\nBạn gõ vài chữ để bắt đầu nhé, ví dụ: *\"Tôi muốn học tiếng Trung từ đầu\"*" + audioNote);
ping();
setInterval(ping, 10000);
input.focus();
</script>
</body>
</html>
