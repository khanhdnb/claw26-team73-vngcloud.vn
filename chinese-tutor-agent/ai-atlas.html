<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI ATLAS · 中国之旅</title>
<style>
/* ===== DESIGN SYSTEM (ui_brief) ===== */
:root{
  /* ===== AI ATLAS — WARM INK-WASH THEME (giấy cổ + thủy mặc) =====
     Tên biến giữ nguyên để không phá code. Giá trị đổi sang tông ấm.
     LƯU Ý: --navy dùng kép (nền tối ẤM + chữ/ink trên nền kem) → chọn
     nâu-đen ấm #2A2018: vừa đủ tối làm nền, vừa làm ink đậm (11–13:1 trên kem). */
  --navy:#2A2018;     /* was #0D1726 — warm sepia-black: dark bg + ink trên kem */
  --red:#A33327;      /* đỏ son Trung Hoa — CTA punchy (giữ độ tươi cho .btn-red) */
  --gold:#D4B27A;     /* champagne gold (giữ nguyên, vốn đã ấm) */
  --jade:#456040;     /* was #2D7466 — sage-jade ấm: "đã biết" hợp tông giấy cổ */
  --ivory:#F4E8D4;    /* was #F7F2EA — kem giấy ấm hơn cho card/light surface */
  --muted:#5F503D;    /* was #8E8576 — taupe ấm cho secondary text (AA trên kem) */
  --stone:#5F503D;    /* alias warm taupe (code có thể gọi --stone) */
  --line:#D8C3A0;     /* was #E8DFD0 — viền giấy cổ ấm */

  /* ===== biến mới (tông ấm mở rộng) ===== */
  --paper:#B8AC9F;    /* nền giấy có vân (vintage atlas paper) */
  --paper-kem:#F0DCC2;/* nền kem chính của app (màn sáng) */
  --paper-kem2:#ECDAC0;/* kem trầm hơn (section/nền phụ) */
  --ink:#2A2018;      /* = --navy: ink chữ trên nền sáng */
  --mist:rgba(244,232,212,.55);/* sương thủy mặc (overlay sáng) */
  --red-soft:#9F5B50; /* đỏ trầm/terracotta cho accent mảng lớn, viền, veil */
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font-body); background:#1a1a1a; color:var(--ivory);
  display:flex; align-items:center; justify-content:center; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
/* phone frame */
#phone{
  width:390px; height:844px; max-height:100vh; background:var(--ivory); color:var(--navy);
  position:relative; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 20px 70px rgba(0,0,0,.6);
}
@media(max-width:430px){ #phone{ width:100vw; height:100vh; } }
#statusbar{
  height:44px; min-height:44px; display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; font-size:14px; font-weight:600; z-index:50; position:relative;
}
#statusbar .time{font-variant-numeric:tabular-nums}
#statusbar .dots{letter-spacing:1px}
#view{flex:1; overflow-y:auto; overflow-x:hidden; position:relative; -webkit-overflow-scrolling:touch}
#view::-webkit-scrollbar{width:0}
#tabbar{
  height:64px; min-height:64px; display:flex; border-top:1px solid var(--line);
  background:var(--ivory); z-index:50;
}
#tabbar.dark{background:var(--navy); border-top-color:rgba(255,255,255,.08)}
#tabbar button{
  flex:1; border:none; background:none; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px; font-size:9px; color:var(--stone);
  font-family:var(--font-body); text-transform:uppercase; letter-spacing:.5px;
}
#tabbar button .ic{font-size:18px; line-height:1}
#tabbar button.active{color:var(--red)}
#tabbar.dark button{color:rgba(247,242,234,.45)}
#tabbar.dark button.active{color:var(--gold)}

/* shared atoms */
.eyebrow{font-size:10px; letter-spacing:2.5px; text-transform:uppercase; font-weight:700}
.eb-red{color:var(--red)} .eb-gold{color:var(--gold)} .eb-jade{color:var(--jade)} .eb-muted{color:var(--stone)}
.h2{font-family:var(--font-disp); font-weight:800; letter-spacing:-1px; line-height:1.08}
.han{font-family:var(--font-han); font-weight:700}
.pin{font-style:italic; color:var(--stone); font-weight:500}
.scr{padding:0 0 28px; min-height:100%}
.pad{padding:0 24px}
.btn{
  display:block; width:100%; border:none; cursor:pointer; font-family:var(--font-body);
  font-weight:700; font-size:15px; padding:16px; text-align:center; letter-spacing:.3px;
}
.btn-gold{background:var(--gold); color:var(--navy)}
.btn-red{background:var(--red); color:var(--ivory)}
.btn-ghost{background:transparent; border:1px solid currentColor}
.btn-row{display:flex; gap:10px}
.btn-row .btn{flex:1}
.divider{height:1px; background:var(--line); margin:0}

/* fade-in per screen */
#view > .scr{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* toast */
#toast{
  position:absolute; left:50%; bottom:84px; transform:translateX(-50%) translateY(20px);
  background:var(--navy); color:var(--ivory); font-size:13px; font-weight:600;
  padding:12px 20px; opacity:0; pointer-events:none; transition:.3s; z-index:100;
  border-left:3px solid var(--gold); max-width:80%;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* settings modal */
#settingsModal{
  position:absolute; inset:0; background:rgba(13,23,38,.92); z-index:200;
  display:none; align-items:center; justify-content:center; padding:30px;
}
#settingsModal.open{display:flex}
.modal-card{background:var(--ivory); color:var(--navy); width:100%; padding:26px; }
.modal-card h3{font-family:var(--font-disp); font-size:20px; font-weight:800; margin-bottom:4px}
.modal-card label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px;
  color:var(--stone); margin:16px 0 6px; font-weight:700}
.modal-card input{width:100%; padding:12px; border:1px solid var(--line); font-size:14px;
  font-family:var(--font-body); background:#fff}
.modal-card input:focus{outline:none; border-color:var(--gold)}
.modal-note{font-size:11px; color:var(--stone); margin-top:14px; line-height:1.5}

/* clickable hanzi (audio) */
.hz{font-family:var(--font-han); cursor:pointer}
.hz.known{color:var(--jade)} .hz.newc{color:var(--gold); border-bottom:2px dotted var(--gold)}

/* lesson · mini-quiz feedback */
.qz-opt{transition:background .15s, border-color .15s}
.qz-opt:hover{background:rgba(247,242,234,.10)!important}
.qz-opt.right{background:rgba(45,116,102,.30)!important; border-color:var(--jade)!important; color:#a8e6d4!important}
.qz-opt.wrong{background:rgba(179,58,46,.20)!important; border-color:var(--red)!important; color:#f3b8b0!important}
/* ============================================================
   AI ATLAS — WARM INK-WASH · EXTRA CSS (append sau CSS gốc)
   KHÔNG dùng ảnh ngoài. Mọi texture bằng gradient nhiều lớp.
   ============================================================ */

/* ---- nền trang tổng: kem giấy cổ thay #131017 ---- */
body{
  background:
    radial-gradient(1200px 700px at 90% 0%, rgba(159,91,80,.10), transparent 60%),
    radial-gradient(900px 500px at 0% 100%, rgba(212,178,122,.14), transparent 60%),
    var(--paper-kem2) !important;
  color:var(--ink);
}

/* =========================================================
   1. KHUNG ĐIỆN THOẠI — vỏ ấm, viền gold mảnh
   ========================================================= */
#phone{
  background:#1c140d;                 /* vỏ nâu-đen ấm thay #000 */
  box-shadow:0 30px 60px rgba(42,32,24,.45), 0 0 0 1px rgba(212,178,122,.18);
}
#view{ background:var(--paper-kem); } /* khung trong = kem giấy */

/* =========================================================
   2. MÀN SÁNG (.scr mặc định) — nền giấy có vân
   ========================================================= */
.scr{
  background:
    linear-gradient(180deg, rgba(255,250,240,.35), rgba(184,172,159,.10)),
    repeating-linear-gradient(0deg,  rgba(116,100,78,.045) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(90deg, rgba(116,100,78,.030) 0 3px, transparent 3px 6px),
    var(--paper-kem);
  color:var(--ink);
}
.scr::after{ /* vệt loang giấy cổ rất nhẹ ở góc */
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 40% at 12% 8%,  rgba(159,91,80,.06), transparent 70%),
    radial-gradient(50% 35% at 92% 96%, rgba(212,178,122,.10), transparent 72%);
}

/* =========================================================
   3. MÀN ONBOARD — TRANH THỦY MẶC (núi mờ + sương + đào hồng)
   Áp khi .scr có class/biến tối: .scr.onboard, .scr.dark,
   [data-screen="onboard"], [data-screen="lesson"]
   ========================================================= */
.scr.onboard, .scr.dark, .scr.lesson,
[data-screen="onboard"] .scr, [data-screen="onboard"],
[data-screen="lesson"]  .scr, [data-screen="lesson"]{
  color:var(--ivory);
  background:
    /* sương sáng trên đỉnh */
    radial-gradient(120% 46% at 50% 6%,  rgba(244,232,212,.16), transparent 60%),
    /* quầng gold ấm (mặt trời mờ) */
    radial-gradient(120% 50% at 78% 24%, rgba(212,178,122,.22), transparent 55%),
    /* mảng đào hồng phớt (hoa đào) bên trái-dưới */
    radial-gradient(150% 60% at 20% 70%, rgba(184,120,128,.28), transparent 60%),
    /* sương trắng-kem dâng từ chân màn */
    radial-gradient(95% 40% at 50% 102%, rgba(184,172,159,.30), transparent 72%),
    /* trời chuyển nâu ấm → nâu-đen */
    linear-gradient(180deg, #3a2a1e 0%, #2A2018 46%, #1c140d 100%);
}
/* lớp NÚI MỜ thủy mặc — bóng núi nhiều tầng bằng radial tối + sương */
.scr.onboard::before, .scr.dark::before, .scr.lesson::before,
[data-screen="onboard"] .scr::before, [data-screen="lesson"] .scr::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    /* núi gần (tối) trái */
    radial-gradient(58% 26% at 26% 66%, rgba(20,14,9,.85), transparent 72%),
    /* núi gần (tối) phải */
    radial-gradient(66% 30% at 74% 72%, rgba(28,20,13,.82), transparent 70%),
    /* núi xa mờ (xám-tím nhạt) */
    radial-gradient(70% 24% at 50% 58%, rgba(120,104,118,.20), transparent 74%),
    /* dải sương ngang chia tầng núi */
    linear-gradient(180deg, transparent 52%, rgba(244,232,212,.10) 60%, transparent 68%);
  mix-blend-mode:screen;opacity:.92;
}
/* nội dung onboard nổi trên 2 lớp tranh */
.scr.onboard > *, .scr.lesson > *, .scr.dark > *,
[data-screen="onboard"] .scr > *, [data-screen="lesson"] .scr > *{ position:relative; z-index:2; }

/* =========================================================
   4. STATUSBAR / TABBAR — hợp tông ấm
   ========================================================= */
#statusbar{ color:var(--ink); }
.scr.onboard #statusbar, .scr.dark #statusbar, .scr.lesson #statusbar,
[data-screen="onboard"] #statusbar, [data-screen="lesson"] #statusbar{ color:var(--ivory); }

#tabbar{
  background:
    linear-gradient(180deg, rgba(255,250,240,.6), rgba(240,220,194,.92)),
    var(--paper-kem);
  border-top:1px solid var(--line);
  color:var(--muted);
  backdrop-filter:saturate(1.05);
}
#tabbar .active, #tabbar [aria-selected="true"], #tabbar .on{
  color:var(--red);                    /* tab active = đỏ son */
}

/* =========================================================
   5. BUTTONS — đỏ son nổi + gold dập nổi (ấm, có chiều sâu)
   ========================================================= */
.btn-red{
  background:linear-gradient(180deg, #C0463A, var(--red));
  color:var(--ivory);
  border:1px solid rgba(110,40,30,.5);
  box-shadow:0 6px 18px rgba(159,91,80,.32), inset 0 1px 0 rgba(255,255,255,.12);
}
.btn-red:active{ transform:translateY(1px); box-shadow:0 3px 10px rgba(159,91,80,.30); }

.btn-gold{
  background:linear-gradient(180deg, #E2C58E, var(--gold));
  color:var(--navy);                   /* navy=ink ấm trên gold → 7.9:1 */
  border:1px solid rgba(154,122,63,.55);
  box-shadow:0 6px 16px rgba(212,178,122,.30), inset 0 1px 0 rgba(255,255,255,.35);
}
.btn-gold:active{ transform:translateY(1px); }

/* nút ghost/outline trên kem */
.btn-ghost, .btn-outline{
  background:transparent;color:var(--ink);border:1px solid var(--ink);
}

/* =========================================================
   6. EYEBROW · HÁN · H2 — chữ Hán đỏ son, headline serif ấm
   ========================================================= */
.eyebrow{ color:var(--red); letter-spacing:2px; text-transform:uppercase; }
.scr.onboard .eyebrow, .scr.lesson .eyebrow{ color:var(--gold); } /* trên nền tối → gold */

.han{
  font-family:'Noto Serif SC', serif;
  color:var(--red);                    /* chữ Hán đỏ son trên kem */
  letter-spacing:6px;
}
.scr.onboard .han, .scr.lesson .han, .scr.dark .han{ color:var(--gold); } /* trên nền tối → gold */

.h2{ color:var(--ink); letter-spacing:-.5px; }
.scr.onboard .h2, .scr.lesson .h2, .scr.dark .h2{ color:var(--ivory); }

/* trạng thái chữ: đã biết (jade ấm) / chữ mới i+1 (gold) — đồng bộ tông */
.han .known, .char.known{ color:var(--jade); border-bottom:3px solid var(--jade); }
.han .new,   .char.new{   color:var(--gold); border-bottom:3px dotted var(--gold); }

/* =========================================================
   7. CITY CARD VEIL — đổi navy-veil sang nâu ấm
   ========================================================= */
.citytag .veil, .citycard .veil, .poster .veil{
  background:linear-gradient(180deg, transparent 28%, rgba(28,20,13,.92));
}

/* viền/đường kẻ trang trí dùng tông ấm */
hr, .divider, .ln{ background:var(--line); border-color:var(--line); }
</style>
</head>
<body>
<div id="phone">
  <div id="statusbar"><span class="time">9:41</span><span class="dots">●●● ⓦ ▮</span></div>
  <div id="view"></div>
  <div id="tabbar"></div>
  <div id="toast"></div>
  <div id="settingsModal">
    <div class="modal-card">
      <h3>Cấu hình AI</h3>
      <p style="font-size:12px;color:var(--stone)">Để trống = chế độ offline (câu mẫu). Có key = AI sinh câu i+1 thật.</p>
      <label>Model</label>
      <input id="cfgModel" placeholder="qwen (mặc định, qua server)">
      <label>API Key (tùy chọn)</label>
      <input id="cfgKey" type="password" placeholder="để trống nếu dùng server qwen">
      <div class="btn-row" style="margin-top:20px">
        <button class="btn btn-ghost" onclick="closeSettings()">Hủy</button>
        <button class="btn btn-gold" onclick="saveSettings()">Lưu</button>
      </div>
      <p class="modal-note">Bảo mật: chế độ key trực tiếp chỉ hợp demo. Mặc định app gọi qwen qua server GreenNode (an toàn hơn).</p>
    </div>
  </div>
</div>

<script>
/* ============================================================
   AI ATLAS — logic_spec_for_claude.md implementation
   ============================================================ */

/* ===== 1. DATA MODELS ===== */
const DICT = {
  "山":{pin:"shān",vi:"núi",pic:"⛰️",rad:true}, "木":{pin:"mù",vi:"cây",pic:"🌳",rad:true},
  "口":{pin:"kǒu",vi:"miệng",pic:"👄",rad:true}, "人":{pin:"rén",vi:"người",pic:"🧍",rad:true},
  "水":{pin:"shuǐ",vi:"nước",pic:"💧",rad:true}, "火":{pin:"huǒ",vi:"lửa",pic:"🔥",rad:true},
  "日":{pin:"rì",vi:"mặt trời",pic:"☀️",rad:true}, "月":{pin:"yuè",vi:"mặt trăng",pic:"🌙",rad:true},
  "女":{pin:"nǚ",vi:"nữ",pic:"👩",rad:true}, "大":{pin:"dà",vi:"lớn",pic:"🙆",rad:true},
  "心":{pin:"xīn",vi:"tim",pic:"❤️",rad:true},
  "我":{pin:"wǒ",vi:"tôi"}, "爱":{pin:"ài",vi:"yêu/thích"}, "你":{pin:"nǐ",vi:"bạn"},
  "茶":{pin:"chá",vi:"trà"}, "锅":{pin:"guō",vi:"nồi"},
  "入":{pin:"rù",vi:"vào"}, "出":{pin:"chū",vi:"ra"}, "小":{pin:"xiǎo",vi:"nhỏ"},
  "中":{pin:"zhōng",vi:"trung/giữa"}, "国":{pin:"guó",vi:"nước/quốc"},
  "吃":{pin:"chī",vi:"ăn",comp:["口"]}, "喝":{pin:"hē",vi:"uống",comp:["口"]},
  "辣":{pin:"là",vi:"cay"}, "钱":{pin:"qián",vi:"tiền"},
  "林":{pin:"lín",vi:"rừng",comp:["木","木"],decode:true}, "明":{pin:"míng",vi:"sáng",comp:["日","月"],decode:true},
  "炎":{pin:"yán",vi:"nóng/viêm",comp:["火","火"],decode:true}, "休":{pin:"xiū",vi:"nghỉ ngơi",comp:["人","木"],decode:true},
  "品":{pin:"pǐn",vi:"phẩm/món",comp:["口","口","口"],decode:true},
  // Chữ giải mã bổ sung — ghép từ bộ thủ tượng hình đã có trong DICT
  "森":{pin:"sēn",vi:"rừng rậm",comp:["木","木","木"],decode:true},
  "众":{pin:"zhòng",vi:"đám đông",comp:["人","人","人"],decode:true},
  "晶":{pin:"jīng",vi:"lấp lánh",comp:["日","日","日"],decode:true},
  "淼":{pin:"miǎo",vi:"mênh mông (nước)",comp:["水","水","水"],decode:true},
  "焱":{pin:"yàn",vi:"lửa rực",comp:["火","火","火"],decode:true},
  // Bộ thủ bổ sung (nguồn: common-chinese-radicals) — làm comp cho chữ giải mã mới
  "土":{pin:"tǔ",vi:"đất",rad:true}, "目":{pin:"mù",vi:"mắt",rad:true},
  "子":{pin:"zǐ",vi:"con/trẻ nhỏ",rad:true}, "宀":{pin:"mián",vi:"mái nhà",rad:true},
  "田":{pin:"tián",vi:"ruộng",rad:true}, "力":{pin:"lì",vi:"sức/lực",rad:true},
  "言":{pin:"yán",vi:"lời nói",rad:true}, "鸟":{pin:"niǎo",vi:"chim",rad:true},
  "马":{pin:"mǎ",vi:"ngựa",rad:true}, "石":{pin:"shí",vi:"đá",rad:true},
  "耳":{pin:"ěr",vi:"tai",rad:true}, "手":{pin:"shǒu",vi:"tay",rad:true},
  "门":{pin:"mén",vi:"cửa",rad:true}, "立":{pin:"lì",vi:"đứng/dựng",rad:true},
  // Chữ giải mã hội ý (会意) — verify cấu tạo + đáp án qua workflow phản biện
  "尘":{pin:"chén",vi:"bụi",comp:["小","土"],decode:true},
  "灶":{pin:"zào",vi:"bếp lò",comp:["火","土"],decode:true},
  "安":{pin:"ān",vi:"an/bình yên",comp:["宀","女"],decode:true},
  "好":{pin:"hǎo",vi:"tốt/hay",comp:["女","子"],decode:true},
  "男":{pin:"nán",vi:"đàn ông/nam",comp:["田","力"],decode:true},
  "看":{pin:"kàn",vi:"nhìn/xem",comp:["手","目"],decode:true},
  "泪":{pin:"lèi",vi:"nước mắt",comp:["水","目"],decode:true},
  "鸣":{pin:"míng",vi:"(chim) hót/kêu",comp:["口","鸟"],decode:true},
  "尖":{pin:"jiān",vi:"nhọn",comp:["小","大"],decode:true},
  "信":{pin:"xìn",vi:"tin tưởng/thư",comp:["人","言"],decode:true},
  "杏":{pin:"xìng",vi:"quả hạnh/cây mơ",comp:["木","口"],decode:true},
  "焚":{pin:"fén",vi:"đốt/thiêu",comp:["木","木","火"],decode:true},
  "字":{pin:"zì",vi:"chữ",comp:["宀","子"],decode:true},
  "灾":{pin:"zāi",vi:"tai họa",comp:["宀","火"],decode:true},
  "问":{pin:"wèn",vi:"hỏi",comp:["门","口"],decode:true},
  "闷":{pin:"mèn",vi:"buồn bực/ngột ngạt",comp:["门","心"],decode:true},
  "闯":{pin:"chuǎng",vi:"xông/lao tới",comp:["门","马"],decode:true},
  "岩":{pin:"yán",vi:"núi đá/nham",comp:["山","石"],decode:true},
  "耷":{pin:"dā",vi:"(tai) cụp/rũ xuống",comp:["大","耳"],decode:true},
  "位":{pin:"wèi",vi:"vị trí/chỗ ngồi",comp:["人","立"],decode:true},
  "伙":{pin:"huǒ",vi:"bạn/nhóm",comp:["人","火"],decode:true},
  // Mở rộng từ HSK1 (nguồn: complete-hsk-vocabulary) — chữ đơn phổ biến, nghĩa tiếng Việt

function speak(text){
  if(!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=0.85;

    const active = S.current===t.s || (t.s==='tone' && S.current==='pinyin');

       <span class="ic">${t.ic}</span>${t.label}</button>`;
  }).join('');
}
function go(s){
  if(S.current && S.current!==s){
    S.history.push(S.current);
    if(S.history.length>30) S.history.shift();
  }
  S.current=s; render();
}
function goBack(fallback){
  const prev=S.history.pop();
  S.current=prev||fallback||'atlas';
  render();
}

/* ===== 02 CITY PICK ===== */
function scrCityPick(){
  const cards = CITY_ORDER.map(k=>{
    const c=CITIES[k]; const p=S.cityProgress[k]||0;
    const status = S.collected.has(k)?'In progress':(p>0?'In progress':'Chưa đặt chân');
    return `<div onclick="pickCity('${k}')" style="position:relative; height:140px; cursor:pointer;
        background:${POSTER(k)}; margin-bottom:1px;
        display:flex; align-items:flex-end">
      <div style="position:absolute; inset:0; background:linear-gradient(transparent 30%, rgba(13,23,38,.85))"></div>
      <div style="position:relative; display:flex; justify-content:space-between; align-items:flex-end; width:100%; padding:16px">
        <div><div class="han" style="color:var(--gold); font-size:34px; line-height:1">${c.cn}</div>
          <div class="h2" style="font-size:20px; color:var(--ivory); margin-top:4px; letter-spacing:1px">${c.name}</div>
          <div style="font-size:13px; color:rgba(247,242,234,.8); margin-top:2px">${c.nameVi||c.name}</div></div>
        <div style="text-align:right"><div class="h2" style="color:var(--gold); font-size:22px">${p}%</div>
          <div style="font-size:8px; color:rgba(247,242,234,.6); text-transform:uppercase">${status}</div></div>
      </div></div>`;
  }).join('');
  return `<div class="scr" style="position:relative">
    ${backBtn(false,'onboard')}
    <div class="pad" style="padding-top:44px; padding-bottom:18px">
      <div class="eyebrow eb-red">Chương 01 · Chọn điểm đến</div>
      <div class="h2" style="font-size:28px; margin-top:6px">Bạn muốn<br>du hành đâu trước?</div>
      <div style="font-size:12px; color:var(--stone); margin-top:6px">6 thành phố · 6 bộ chữ Hán · 1 hành trình</div>
    </div>
    ${cards}
    <div class="pad" style="margin-top:18px">
      <button class="btn btn-red" id="cityCta" onclick="afterPick()" ${S.city?'':'disabled style="opacity:.4"'}>Khởi hành →</button>
    </div></div>`;
}
function pickCity(k){
  S.city=k;
  document.querySelectorAll('#view [onclick^="pickCity"]').forEach(el=>el.style.outline='');
  event.currentTarget.style.outline='2px solid var(--red)';
  const cta=$('cityCta'); cta.disabled=false; cta.style.opacity='1';
  toast(`Đã chọn ${CITIES[k].nameVi||CITIES[k].name}`);
}
function afterPick(){ if(!S.city)return; go('seed'); }

/* ===== 03 SEED ===== */
function scrSeed(){
  const c=CITIES[S.city];
  /* lấy 3 chữ pictograph thật từ seed của city (chữ có cả rad + pic) */
  const picSeeds=c.seed.filter(ch=>DICT[ch]&&DICT[ch].rad&&DICT[ch].pic).slice(0,3);
  while(picSeeds.length<3){ for(const fb of ['山','口','人']) if(!picSeeds.includes(fb)) picSeeds.push(fb); }
  picSeeds.forEach(x=>S.known.add(x));
  const featured=picSeeds[0], fd=DICT[featured];
  const seeds=picSeeds.map(ch=>{const d=DICT[ch];
    return `<div onclick="speak('${ch}')" style="background:var(--ivory); border:1px solid var(--line); padding:12px 6px; text-align:center; flex:1; cursor:pointer">
      <div style="font-size:24px; line-height:1">${d.pic}</div>
      <div class="han" style="font-size:26px; color:var(--navy); margin-top:4px">${ch}</div>
      <div style="font-size:10px; color:var(--stone); margin-top:3px">${d.pin}</div>
      <div style="font-size:10px; color:var(--navy); margin-top:1px">${d.vi}</div></div>`}).join('');
  return `<div class="scr pad" style="padding-top:44px; padding-bottom:24px; position:relative">
    ${backBtn(false,'citypick')}
    <div class="eyebrow eb-jade">Ngày 01 · Gieo hạt · ${c.nameVi||c.name}</div>
    <div class="h2" style="font-size:24px; margin-top:6px; line-height:1.15">Đến ${c.nameVi||c.name}.<br>Đọc chữ đầu tiên<br>từ hình ảnh.</div>
    <div style="font-size:12px; color:var(--stone); margin-top:10px; line-height:1.5">Chữ Hán cổ vốn là tranh vẽ. Nhìn hình → nhớ chữ — không học vẹt, không học thuộc.</div>

    <div style="background:var(--navy); padding:24px; margin-top:18px; color:var(--ivory)">
      <div class="eyebrow eb-gold">Ví dụ · pictograph</div>
      <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin:18px 0">
        <span style="font-size:56px">${fd.pic}</span><span style="color:var(--stone)">→</span>
        <span class="han" style="font-size:72px; color:var(--gold); cursor:pointer" onclick="speak('${featured}')">${featured}</span></div>
      <div style="text-align:center; font-size:13px"><span class="han">${featured}</span> = ${fd.vi} · <span class="pin" style="color:var(--gold)">${fd.pin}</span></div>
      <div style="text-align:center; font-size:9px; color:rgba(247,242,234,.5); margin-top:6px; letter-spacing:1.5px; text-transform:uppercase">↑ Chạm chữ để nghe</div>
      <div style="border-top:1px solid var(--jade); margin-top:14px; padding-top:12px; text-align:center; font-size:12px; color:var(--jade)">✓ Bạn vừa đọc được chữ Hán đầu tiên</div>
    </div>

    <div class="eyebrow eb-muted" style="margin-top:22px">3 hạt giống của ${c.nameVi||c.name}</div>
    <div style="font-size:11px; color:var(--stone); margin-top:4px; line-height:1.4">Mỗi chữ là <b>bộ thủ</b> — viên gạch xây nên hàng trăm chữ phức tạp hơn. Chạm để nghe.</div>
    <div style="display:flex; gap:8px; margin-top:10px">${seeds}</div>

    <div style="background:rgba(45,116,102,.12); border-left:3px solid var(--jade); padding:12px 14px; margin-top:18px; font-size:12px; color:var(--navy); line-height:1.5">
      <b>Tiếp theo trong Atlas:</b> AI sinh câu thật từ các chữ này + đúng <b>1 chữ mới</b> mỗi lần — bạn học bằng <i>hiểu bối cảnh</i>, không học thuộc.
    </div>

    <button class="btn btn-red" style="margin-top:18px" onclick="finishSeed()">Khởi hành đến Atlas →</button>
  </div>`;
}
function finishSeed(){
  CITIES[S.city].seed.forEach(c=>S.known.add(c));
  S.collected.add(S.city);
  S.cityProgress[S.city]=Math.min(99,Math.round(S.known.size/12*100));

function toneOf(pin){
  if(!pin) return 5;
  const T={1:"āēīōūǖĀĒĪŌŪǕ",2:"áéíóúǘÁÉÍÓÚǗ",3:"ǎěǐǒǔǚǍĚǏǑǓǙ",4:"àèìòùǜÀÈÌÒÙǛ"};
  for(const [k,chars] of Object.entries(T)) for(const c of chars) if(pin.includes(c)) return +k;
  return 5;
}
/* sinh 3 đáp án quiz */
function makeQuizOptions(rightVi, newChar){
  const pool=Object.entries(DICT||{}).filter(([ch,e])=>ch!==newChar && e.vi && e.vi!==rightVi).map(([,e])=>e.vi);
  const distractors=[];
  let seed=newChar.charCodeAt(0);
  while(distractors.length<2 && pool.length){
    const i=(seed*(distractors.length+7))%pool.length;
    const pick=pool.splice(i,1)[0];
    if(!distractors.includes(pick)) distractors.push(pick);
  }
  while(distractors.length<2) distractors.push("(khác)");
  const opts=[rightVi,...distractors];
  for(let i=opts.length-1;i>0;i--){ const j=(seed*(i+1))%(i+1); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  return {opts, rightIdx:opts.indexOf(rightVi)};
}
function quizAnswer(idx, rightIdx){
  const opts=document.querySelectorAll('.qz-opt');
  if(!opts.length || opts[0].dataset.done) return;
  opts.forEach(o=>o.dataset.done='1');
  opts[idx].classList.add(idx===rightIdx?'right':'wrong');
  if(idx!==rightIdx) opts[rightIdx].classList.add('right');
  const fb=$('quizFb');
  if(fb){
    if(idx===rightIdx){ S.xp=(S.xp||0)+5; fb.textContent='✓ Chính xác · +5 XP'; fb.style.color='var(--jade)'; }
    else { fb.textContent='✗ Chưa đúng — đáp án đã sáng.'; fb.style.color='#f3b8b0'; }
    saveState&&saveState();
  }
}

function autoCorrelate(buf, sampleRate){
  let SIZE=buf.length, rms=0;
  for(let i=0;i<SIZE;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE); if(rms<0.01) return -1;
  let r1=0,r2=SIZE-1,thres=0.2;
  for(let i=0;i<SIZE/2;i++) if(Math.abs(buf[i])<thres){r1=i;break;}
  for(let i=1;i<SIZE/2;i++) if(Math.abs(buf[SIZE-i])<thres){r2=SIZE-i;break;}
  buf=buf.slice(r1,r2); SIZE=buf.length;
  const c=new Array(SIZE).fill(0);
  for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE-i;j++) c[i]+=buf[j]*buf[j+i];
  let d=0; while(d<SIZE-1 && c[d]>c[d+1]) d++;
  let maxv=-1,maxp=-1;
  for(let i=d;i<SIZE;i++) if(c[i]>maxv){maxv=c[i];maxp=i;}
  if(maxp<=0) return -1;
  const f=sampleRate/maxp;
  return (f>70&&f<500)?f:-1;
}
async function recordTone(){
  if(recording)return;
  recording=true; render();
  let frames=[];
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(stream);
    const an=ac.createAnalyser(); an.fftSize=2048; src.connect(an);
    const buf=new Float32Array(an.fftSize); const start=performance.now();
    await new Promise(res=>{(function tick(){
      an.getFloatTimeDomainData(buf);
      const f=autoCorrelate(buf,ac.sampleRate); if(f>0)frames.push(f);
      if(performance.now()-start<1400) requestAnimationFrame(tick); else res();
    })();});
    stream.getTracks().forEach(t=>t.stop()); ac.close(); toneSim=false;
  }catch(e){ toneSim=true; frames=simulateFrames(); }
  finishTone(frames);
}
function simulateFrames(){
  const tc=TONES[curTone].c, out=[];
  for(let i=0;i<40;i++){ const p=i/39*(tc.length-1); const lo=Math.floor(p);
    const v=tc[lo]+(tc[Math.min(lo+1,tc.length-1)]-tc[lo])*(p-lo);
    out.push(120+v*120+(Math.random()-0.5)*22); }
  return out;
}
function finishTone(freqs){
  recording=false;
  freqs=freqs.filter(f=>f>0);
  if(freqs.length<5){ userContour=null; toneScore=0; render(); return; }
  const N=5, bucket=[];
  for(let i=0;i<N;i++){ const a=Math.floor(freqs.length*i/N), b=Math.floor(freqs.length*(i+1)/N);
    const seg=freqs.slice(a,b); bucket.push(seg.reduce((x,y)=>x+y,0)/seg.length); }
  const logs=bucket.map(f=>Math.log2(f)); const mn=Math.min(...logs),mx=Math.max(...logs); const range=mx-mn;
  userContour = range<0.06 ? bucket.map(()=>0.85) : logs.map(l=>(l-mn)/range);
  const tc=TONES[curTone].c; const tVar=variance(tc);
  if(tVar<0.005) toneScore=Math.round(Math.max(0,100-variance(userContour)*900));
  else toneScore=Math.round(Math.max(0,pearson(userContour,tc))*100);
  toneScore=Math.max(0,Math.min(100,toneScore));
  render();
}
function variance(a){ const m=a.reduce((x,y)=>x+y,0)/a.length; return a.reduce((s,v)=>s+(v-m)**2,0)/a.length; }
function pearson(a,b){ const n=a.length; const ma=a.reduce((x,y)=>x+y,0)/n, mb=b.reduce((x,y)=>x+y,0)/n;
  let num=0,da=0,db=0; for(let i=0;i<n;i++){num+=(a[i]-ma)*(b[i]-mb); da+=(a[i]-ma)**2; db+=(b[i]-mb)**2;}
  return (da&&db)?num/Math.sqrt(da*db):0; }
function drawTone(){
  const cv=$('tonecv'); if(!cv)return; const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
  const tc=TONES[curTone].c;
  const toX=i=>20+i/(tc.length-1)*(W-40);
  const toY=v=>H-20-v*(H-40);
  // target dashed
  ctx.setLineDash([10,8]); ctx.strokeStyle='rgba(247,242,234,.5)'; ctx.lineWidth=4; ctx.beginPath();
  tc.forEach((v,i)=>{ const x=toX(i),y=toY(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  // user solid
  if(userContour){ ctx.setLineDash([]); ctx.strokeStyle='#D4B27A'; ctx.lineWidth=5; ctx.lineJoin='round'; ctx.beginPath();
    userContour.forEach((v,i)=>{ const x=toX(i),y=toY(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    ctx.fillStyle='#D4B27A'; userContour.forEach((v,i)=>{ ctx.beginPath(); ctx.arc(toX(i),toY(v),4,0,7); ctx.fill(); });
  }
}

function genLocal(){
  /* tìm template hợp lệ: newC chưa thuộc + mọi chữ khác đã thuộc + DICT có newC */
  for(const t of SENTENCE_TEMPLATES){
    if(S.known.has(t.newC)) continue;
    if(!DICT[t.newC]) continue;
    const chars=[...t.hz];
    if(chars.indexOf(t.newC)<0) continue;
    const ok=chars.every(ch=>ch===t.newC||S.known.has(ch));
    if(!ok) continue;
    return {
      hanzi:t.hz,
      pinyin:chars.map(c=>DICT[c]?.pin||"").join(" "),
      vi:t.vi,
      newChar:t.newC,
      newPin:DICT[t.newC].pin,
      newVi:DICT[t.newC].vi,
      story:CITIES[S.city]?.story||""
    };
  }
  /* fallback an toàn — không tạo câu giả: chỉ giới thiệu 1 chữ mới đứng riêng kèm 1 chữ đã thuộc làm cảnh */
  const newPool=Object.keys(DICT).filter(c=>!S.known.has(c));
  const nc=newPool[0]||"辣";
  const base=[...S.known].find(c=>DICT[c]);
  const hz=base?base+nc:nc;
  return {
    hanzi:hz,
    pinyin:[...hz].map(c=>DICT[c]?.pin||"").join(" "),
    vi:base?`${DICT[base].vi} + ${DICT[nc].vi} (ghép tự do)`:DICT[nc].vi,
    newChar:nc, newPin:DICT[nc].pin, newVi:DICT[nc].vi,
    story:CITIES[S.city]?.story||""
  };
}

function saveSettings(){
  CFG.model=$('cfgModel').value.trim(); CFG.key=$('cfgKey').value.trim();
  saveCfg(); closeSettings(); toast(CFG.key?'AI key trực tiếp đã bật':'Dùng server qwen / offline');
}

/* ===== 10. INIT ===== */
(function applyHash(){
  const h=location.hash.slice(1); if(!h)return;
  const p=new URLSearchParams(h);
  const c=p.get('c'); if(c&&CITIES[c])S.city=c;
  const k=p.get('k'); if(k)k.split(',').forEach(ch=>ch&&S.known.add(ch));
  const col=p.get('col'); if(col)col.split(',').forEach(ch=>ch&&S.collected.add(ch));
  const cp=p.get('cp'); if(cp)cp.split(';').forEach(pair=>{const[ct,val]=pair.split(':'); if(ct&&val)S.cityProgress[ct]=parseInt(val);});
  const d=p.get('d'); if(d!=null)S.decodeIdx=parseInt(d);
  const sk=p.get('sk'); if(sk)S.streak=parseInt(sk);
  const xp=p.get('xp'); if(xp)S.xp=parseInt(xp);
  const s=p.get('s'); if(s)S.current=s;
})();
loadState();
if('speechSynthesis'in window) speechSynthesis.getVoices();
render();

function POSTER(k){
  // Gradient nền (fallback khi ảnh chưa load / lỗi) — giữ tông từng thành phố
  const g={
    chengdu:"radial-gradient(ellipse at 50% 24%, #C8503A 0%, #9F3B2E 34%, #5e2418 72%, #2A1810 100%)",
    shanghai:"linear-gradient(180deg, #2c3b52 0%, #3f5876 38%, #d98f5a 70%, #7a4a2c 88%, #2a1810 100%)",
    beijing:"linear-gradient(180deg, #C9A14E 0%, #9c6f33 42%, #6e4a26 72%, #3a2414 100%)",
    hangzhou:"linear-gradient(180deg, #d3e2d1 0%, #7fae9a 38%, #3f7d72 70%, #234c46 100%)",
    xian:"linear-gradient(180deg, #E2BC7C 0%, #b9823f 44%, #7a4e26 76%, #3a2414 100%)",
    guilin:"linear-gradient(180deg, #bdd1b6 0%, #6f9a78 36%, #3f6b54 68%, #213f30 100%)"
  };
  const grad=g[k]||g.chengdu;
  // Ảnh poster THẬT chồng lên gradient (ảnh hiển thị trên, gradient là fallback)
  return `url(data:image/jpeg;base64,${POSTER_IMG[k]||""}) center/cover, ${grad}`;
}
