<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI ATLAS · 中国之旅</title>
<style>
/* ===== DESIGN SYSTEM (ui_brief) ===== */
:root{
  --navy:#0D1726; --red:#B33A2E; --gold:#D4B27A; --jade:#2D7466;
  --ivory:#F7F2EA; --stone:#8E8576; --line:#E8DFD0;
  --font-disp:"Inter Tight",Inter,-apple-system,system-ui,sans-serif;
  --font-han:"Noto Serif SC",serif;
  --font-body:Inter,-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font-body); background:#1a1a1a; color:var(--ivory);
  display:flex; align-items:center; justify-content:center; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
/* phone frame */
#phone{
  width:390px; height:844px; max-height:100vh; background:var(--ivory); color:var(--navy);
  position:relative; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 20px 70px rgba(0,0,0,.6);
}
@media(max-width:430px){ #phone{ width:100vw; height:100vh; } }
#statusbar{
  height:44px; min-height:44px; display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; font-size:14px; font-weight:600; z-index:50; position:relative;
}
#statusbar .time{font-variant-numeric:tabular-nums}
#statusbar .dots{letter-spacing:1px}
#view{flex:1; overflow-y:auto; overflow-x:hidden; position:relative; -webkit-overflow-scrolling:touch}
#view::-webkit-scrollbar{width:0}
#tabbar{
  height:64px; min-height:64px; display:flex; border-top:1px solid var(--line);
  background:var(--ivory); z-index:50;
}
#tabbar.dark{background:var(--navy); border-top-color:rgba(255,255,255,.08)}
#tabbar button{
  flex:1; border:none; background:none; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px; font-size:9px; color:var(--stone);
  font-family:var(--font-body); text-transform:uppercase; letter-spacing:.5px;
}
#tabbar button .ic{font-size:18px; line-height:1}
#tabbar button.active{color:var(--red)}
#tabbar.dark button{color:rgba(247,242,234,.45)}
#tabbar.dark button.active{color:var(--gold)}

/* shared atoms */
.eyebrow{font-size:10px; letter-spacing:2.5px; text-transform:uppercase; font-weight:700}
.eb-red{color:var(--red)} .eb-gold{color:var(--gold)} .eb-jade{color:var(--jade)} .eb-muted{color:var(--stone)}
.h2{font-family:var(--font-disp); font-weight:800; letter-spacing:-1px; line-height:1.08}
.han{font-family:var(--font-han); font-weight:700}
.pin{font-style:italic; color:var(--stone); font-weight:500}
.scr{padding:0 0 28px; min-height:100%}
.pad{padding:0 24px}
.btn{
  display:block; width:100%; border:none; cursor:pointer; font-family:var(--font-body);
  font-weight:700; font-size:15px; padding:16px; text-align:center; letter-spacing:.3px;
}
.btn-gold{background:var(--gold); color:var(--navy)}
.btn-red{background:var(--red); color:var(--ivory)}
.btn-ghost{background:transparent; border:1px solid currentColor}
.btn-row{display:flex; gap:10px}
.btn-row .btn{flex:1}
.divider{height:1px; background:var(--line); margin:0}

/* fade-in per screen */
#view > .scr{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* toast */
#toast{
  position:absolute; left:50%; bottom:84px; transform:translateX(-50%) translateY(20px);
  background:var(--navy); color:var(--ivory); font-size:13px; font-weight:600;
  padding:12px 20px; opacity:0; pointer-events:none; transition:.3s; z-index:100;
  border-left:3px solid var(--gold); max-width:80%;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* settings modal */
#settingsModal{
  position:absolute; inset:0; background:rgba(13,23,38,.92); z-index:200;
  display:none; align-items:center; justify-content:center; padding:30px;
}
#settingsModal.open{display:flex}
.modal-card{background:var(--ivory); color:var(--navy); width:100%; padding:26px; }
.modal-card h3{font-family:var(--font-disp); font-size:20px; font-weight:800; margin-bottom:4px}
.modal-card label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px;
  color:var(--stone); margin:16px 0 6px; font-weight:700}
.modal-card input{width:100%; padding:12px; border:1px solid var(--line); font-size:14px;
  font-family:var(--font-body); background:#fff}
.modal-card input:focus{outline:none; border-color:var(--gold)}
.modal-note{font-size:11px; color:var(--stone); margin-top:14px; line-height:1.5}

/* clickable hanzi (audio) */
.hz{font-family:var(--font-han); cursor:pointer}
.hz.known{color:var(--jade)} .hz.newc{color:var(--gold); border-bottom:2px dotted var(--gold)}
</style>
</head>
<body>
<div id="phone">
  <div id="statusbar"><span class="time">9:41</span><span class="dots">●●● ⓦ ▮</span></div>
  <div id="view"></div>
  <div id="tabbar"></div>
  <div id="toast"></div>
  <div id="settingsModal">
    <div class="modal-card">
      <h3>Cấu hình AI</h3>
      <p style="font-size:12px;color:var(--stone)">Để trống = chế độ offline (câu mẫu). Có key = AI sinh câu i+1 thật.</p>
      <label>Model</label>
      <input id="cfgModel" placeholder="qwen (mặc định, qua server)">
      <label>API Key (tùy chọn)</label>
      <input id="cfgKey" type="password" placeholder="để trống nếu dùng server qwen">
      <div class="btn-row" style="margin-top:20px">
        <button class="btn btn-ghost" onclick="closeSettings()">Hủy</button>
        <button class="btn btn-gold" onclick="saveSettings()">Lưu</button>
      </div>
      <p class="modal-note">Bảo mật: chế độ key trực tiếp chỉ hợp demo. Mặc định app gọi qwen qua server GreenNode (an toàn hơn).</p>
    </div>
  </div>
</div>

<script>
/* ============================================================
   AI ATLAS — logic_spec_for_claude.md implementation
   ============================================================ */

/* ===== 1. DATA MODELS ===== */
const DICT = {
  "山":{pin:"shān",vi:"núi",pic:"⛰️",rad:true}, "木":{pin:"mù",vi:"cây",pic:"🌳",rad:true},
  "口":{pin:"kǒu",vi:"miệng",pic:"👄",rad:true}, "人":{pin:"rén",vi:"người",pic:"🧍",rad:true},
  "水":{pin:"shuǐ",vi:"nước",pic:"💧",rad:true}, "火":{pin:"huǒ",vi:"lửa",pic:"🔥",rad:true},
  "日":{pin:"rì",vi:"mặt trời",pic:"☀️",rad:true}, "月":{pin:"yuè",vi:"mặt trăng",pic:"🌙",rad:true},
  "女":{pin:"nǚ",vi:"nữ",pic:"👩",rad:true}, "大":{pin:"dà",vi:"lớn",pic:"🙆",rad:true},
  "心":{pin:"xīn",vi:"tim",pic:"❤️",rad:true},
  "我":{pin:"wǒ",vi:"tôi"}, "爱":{pin:"ài",vi:"yêu/thích"}, "你":{pin:"nǐ",vi:"bạn"},
  "好":{pin:"hǎo",vi:"tốt",comp:["女"]}, "茶":{pin:"chá",vi:"trà"}, "锅":{pin:"guō",vi:"nồi"},
  "入":{pin:"rù",vi:"vào"}, "出":{pin:"chū",vi:"ra"}, "小":{pin:"xiǎo",vi:"nhỏ"},
  "中":{pin:"zhōng",vi:"trung/giữa"}, "国":{pin:"guó",vi:"nước/quốc"},
  "吃":{pin:"chī",vi:"ăn",comp:["口"]}, "喝":{pin:"hē",vi:"uống",comp:["口"]},
  "辣":{pin:"là",vi:"cay"}, "钱":{pin:"qián",vi:"tiền"},
  "林":{pin:"lín",vi:"rừng",comp:["木","木"],decode:true}, "明":{pin:"míng",vi:"sáng",comp:["日","月"],decode:true},
  "炎":{pin:"yán",vi:"nóng/viêm",comp:["火","火"],decode:true}, "休":{pin:"xiū",vi:"nghỉ ngơi",comp:["人","木"],decode:true},
  "品":{pin:"pǐn",vi:"phẩm/món",comp:["口","口","口"],decode:true}
};
const CITIES = {
  chengdu:{name:"CHENGDU",cn:"成都",topic:"Ẩm thực",seed:["火","锅","辣","茶","吃","喝","水","口"],story:"Hẻm Chengdu, hơi nồi lẩu bốc lên giữa lồng đèn đỏ."},
  shanghai:{name:"SHANGHAI",cn:"上海",topic:"Công việc",seed:["我","你","好","人","大","中","国","心"],story:"Skyline Phố Đông sau cơn mưa, đèn neon mờ trong sương."},
  beijing:{name:"BEIJING",cn:"北京",topic:"Giao tiếp",seed:["你","好","我","吃","喝","口","人","大"],story:"Hutong xám sớm mai, mùi bánh bao nóng từ tiệm vỉa hè."},
  hangzhou:{name:"HANGZHOU",cn:"杭州",topic:"Lối sống",seed:["水","月","山","木","女","好","茶"],story:"Hồ Tây phủ sương, thuyền nan chậm trôi qua cầu đá."},
  xian:{name:"XI'AN",cn:"西安",topic:"Lịch sử · HSK",seed:["日","月","大","人","口","木","火","中"],story:"Tường thành vàng nâu lúc hoàng hôn, ngựa đất nung im lìm."},
  guilin:{name:"GUILIN",cn:"桂林",topic:"Thiên nhiên",seed:["山","水","木","日","月","火"],story:"Núi đá karst nổi trên sông Li, thuyền tre lướt giữa mây."}
};
const SIGNS = {
  chengdu:["火锅店","辣火锅","好吃"], shanghai:["入口","出口","中国"], beijing:["你好","我爱中国"],
  hangzhou:["大山茶","水月"], xian:["明月","日月"], guilin:["林山水","山林"]
};
const DECODE_QUESTIONS = [
  {char:"林",opts:["Rừng","Sông","Núi"],ans:0,hint:"Hai cây 木 đứng cạnh nhau → ?"},
  {char:"明",opts:["Tối","Sáng","Lạnh"],ans:1,hint:"Mặt trời 日 + mặt trăng 月 cùng chiếu → ?"},
  {char:"炎",opts:["Nóng","Mát","Ướt"],ans:0,hint:"Hai lửa 火 chồng lên nhau → ?"},
  {char:"休",opts:["Chạy","Nghỉ ngơi","Ăn"],ans:1,hint:"Người 人 tựa cây 木 → ?"},
  {char:"品",opts:["Phẩm/món","Cây","Sông"],ans:0,hint:"Ba miệng 口 nếm món → ?"}
];
const TONES = {
  1:{label:"mā",name:"Thanh 1 · ngang cao",c:[0.85,0.85,0.85,0.85,0.85]},
  2:{label:"má",name:"Thanh 2 · đi lên",c:[0.38,0.5,0.62,0.76,0.9]},
  3:{label:"mǎ",name:"Thanh 3 · xuống rồi lên",c:[0.6,0.34,0.2,0.4,0.66]},
  4:{label:"mà",name:"Thanh 4 · đi xuống",c:[0.92,0.72,0.5,0.3,0.12]}
};
const COMMON_TARGET=50, ENGINE_THRESHOLD=12;
const CITY_COORDS={beijing:{x:228,y:80},xian:{x:160,y:135},shanghai:{x:265,y:175},chengdu:{x:110,y:175},hangzhou:{x:248,y:200},guilin:{x:180,y:240}};
const CITY_ORDER=["chengdu","shanghai","beijing","hangzhou","xian","guilin"];

/* ===== 2. STATE ===== */
let S = {
  city:null, known:new Set(),
  cityProgress:{chengdu:0,shanghai:0,beijing:0,hangzhou:0,xian:0,guilin:0},
  collected:new Set(), streak:7, xp:1240, decodeIdx:0, current:'onboard'
};
function loadState(){
  try{ const r=JSON.parse(localStorage.getItem('aiatlas_state')); if(!r) return;
    S.city=r.city; S.known=new Set(r.known||[]); S.cityProgress=r.cityProgress||S.cityProgress;
    S.collected=new Set(r.collected||[]); S.streak=r.streak??7; S.xp=r.xp??1240;
    S.decodeIdx=r.decodeIdx||0; S.current=r.current||'onboard';
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem('aiatlas_state', JSON.stringify({
    city:S.city, known:[...S.known], cityProgress:S.cityProgress, collected:[...S.collected],
    streak:S.streak, xp:S.xp, decodeIdx:S.decodeIdx, current:S.current
  })); }catch(e){}
}
let CFG = loadCfg();
function loadCfg(){ try{return JSON.parse(localStorage.getItem('aiatlas_cfg'))||{}}catch(e){return{}} }
function saveCfg(){ localStorage.setItem('aiatlas_cfg', JSON.stringify(CFG)); }

/* ===== tone local state ===== */
let curTone=2, userContour=null, toneScore=null, toneSim=false, recording=false;
let curSign=0;

/* ===== utils ===== */
const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function pct(n,d){ return Math.min(99, Math.round(n/d*100)); }
function speak(text){
  if(!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=0.85;
  const v=speechSynthesis.getVoices().find(x=>/zh/i.test(x.lang)); if(v)u.voice=v;
  speechSynthesis.speak(u);
}

/* ===== 3. ROUTER ===== */
const TABS=[
  {s:'atlas',ic:'🗺️',label:'Atlas'}, {s:'lesson',ic:'📖',label:'Học'},
  {s:'tone',ic:'🎵',label:'Phát âm'}, {s:'camera',ic:'📷',label:'Thế giới'},
  {s:'progress',ic:'🧭',label:'Hành trình'}
];
const DARK_SCREENS=new Set(['onboard','lesson','camera']);
function render(){
  const v=$('view');
  switch(S.current){
    case 'onboard': v.innerHTML=scrOnboard(); break;
    case 'citypick': v.innerHTML=scrCityPick(); break;
    case 'seed': v.innerHTML=scrSeed(); break;
    case 'atlas': v.innerHTML=scrAtlas(); break;
    case 'citydetail': v.innerHTML=scrCityDetail(); break;
    case 'lesson': v.innerHTML=scrLessonShell(); maybeGenerate(); break;
    case 'camera': v.innerHTML=scrCamera(); setTimeout(scanSign,30); break;
    case 'tone': v.innerHTML=scrTone(); setTimeout(drawTone,30); break;
    case 'decode': v.innerHTML=scrDecode(); break;
    case 'progress': v.innerHTML=scrProgress(); break;
  }
  // phone chrome
  const dark=DARK_SCREENS.has(S.current);
  $('phone').style.background = dark?'var(--navy)':'var(--ivory)';
  $('statusbar').style.color = dark?'var(--ivory)':'var(--navy)';
  $('view').style.background = dark?'var(--navy)':'var(--ivory)';
  renderTabbar();
  v.scrollTop=0; saveState();
}
function renderTabbar(){
  const tb=$('tabbar');
  const hide = ['onboard','citypick','seed'].includes(S.current);
  tb.style.display = hide?'none':'flex';
  tb.className = DARK_SCREENS.has(S.current)?'dark':'';
  if(hide){ tb.innerHTML=''; return; }
  tb.innerHTML = TABS.map(t=>
    `<button class="${S.current===t.s?'active':''}" onclick="go('${t.s}')">
       <span class="ic">${t.ic}</span>${t.label}</button>`).join('');
}
function go(s){ S.current=s; render(); }

/* ===== screens injected below (part 2) ===== */
</script>
<script>
/* ============================================================
   AI ATLAS — SCREENS + ENGINE + DSP (part 2)
   ============================================================ */

/* ---------- helpers shared by screens ---------- */
function hanziSpan(ch, isKnown, isNew){
  const cls = isNew?'newc':(isKnown?'known':'');
  return `<span class="hz ${cls}" onclick="speak('${ch}')">${ch}</span>`;
}
function settingsGear(dark){
  const col = dark?'var(--gold)':'var(--stone)';
  return `<button onclick="openSettings()" style="position:absolute;top:8px;right:18px;background:none;border:none;color:${col};font-size:18px;cursor:pointer;z-index:10">⚙</button>`;
}

/* ===== 01 ONBOARD ===== */
function scrOnboard(){
  return `<div class="scr" style="background:
      radial-gradient(circle at 85% 8%, rgba(179,58,46,.35), transparent 45%),
      radial-gradient(circle at 12% 92%, rgba(212,178,122,.22), transparent 45%),
      var(--navy); color:var(--ivory); display:flex; flex-direction:column;
      min-height:100%; padding:56px 30px 36px; text-align:center; position:relative">
    ${settingsGear(true)}
    <div class="eyebrow eb-gold" style="letter-spacing:8px">A · I</div>
    <div class="h2" style="font-size:74px; color:var(--ivory); margin-top:4px">ATLAS</div>
    <div class="han" style="font-size:22px; color:var(--gold); letter-spacing:6px; margin-top:6px">中国之旅</div>
    <div style="margin-top:40px; font-family:var(--font-disp); font-size:19px; line-height:1.5">
      Read China, don't <span style="font-style:italic;color:var(--gold)">memorize</span> China.</div>
    <div style="font-size:12px; color:rgba(247,242,234,.6); margin-top:10px">Đừng học thuộc. Hãy giải mã.</div>
    <div style="flex:1; display:flex; align-items:center; justify-content:center; margin:24px 0">
      <div style="width:170px; height:170px; border-radius:50%;
        background:radial-gradient(circle, rgba(212,178,122,.30), transparent 65%);
        display:flex; align-items:center; justify-content:center; font-size:96px">${MAY('default')}</div>
    </div>
    <div class="eyebrow eb-gold" style="margin-bottom:14px">Người dẫn đường của bạn · MÂY</div>
    <button class="btn btn-gold" onclick="go('citypick')">Bắt đầu hành trình →</button>
  </div>`;
}

/* ===== 02 CITY PICK ===== */
function scrCityPick(){
  const cards = CITY_ORDER.map(k=>{
    const c=CITIES[k]; const p=S.cityProgress[k]||0;
    const status = S.collected.has(k)?'In progress':(p>0?'In progress':'Chưa đặt chân');
    return `<div onclick="pickCity('${k}')" style="position:relative; height:140px; cursor:pointer;
        background:${POSTER(k)}; background-size:cover; background-position:center; margin-bottom:1px;
        display:flex; align-items:flex-end">
      <div style="position:absolute; inset:0; background:linear-gradient(transparent 30%, rgba(13,23,38,.85))"></div>
      <div style="position:relative; display:flex; justify-content:space-between; align-items:flex-end; width:100%; padding:16px">
        <div><div class="han" style="color:var(--gold); font-size:34px">${c.cn}</div>
          <div class="h2" style="font-size:20px; color:var(--ivory)">${c.name}</div>
          <div style="font-size:10px; color:rgba(247,242,234,.7); text-transform:uppercase; letter-spacing:1px">${c.topic}</div></div>
        <div style="text-align:right"><div class="h2" style="color:var(--gold); font-size:22px">${p}%</div>
          <div style="font-size:8px; color:rgba(247,242,234,.6); text-transform:uppercase">${status}</div></div>
      </div></div>`;
  }).join('');
  return `<div class="scr">
    <div class="pad" style="padding-top:24px; padding-bottom:18px">
      <div class="eyebrow eb-red">Chương 01 · Chọn điểm đến</div>
      <div class="h2" style="font-size:28px; margin-top:6px">Bạn muốn<br>du hành đâu trước?</div>
      <div style="font-size:12px; color:var(--stone); margin-top:6px">6 thành phố · 6 bộ chữ Hán · 1 hành trình</div>
    </div>
    ${cards}
    <div class="pad" style="margin-top:18px">
      <button class="btn btn-red" id="cityCta" onclick="afterPick()" ${S.city?'':'disabled style="opacity:.4"'}>Khởi hành →</button>
    </div></div>`;
}
function pickCity(k){
  S.city=k;
  document.querySelectorAll('#view [onclick^="pickCity"]').forEach(el=>el.style.outline='');
  event.currentTarget.style.outline='2px solid var(--red)';
  const cta=$('cityCta'); cta.disabled=false; cta.style.opacity='1';
  toast(`Đã chọn ${CITIES[k].name}`);
}
function afterPick(){ if(!S.city)return; go('seed'); }

/* ===== 03 SEED ===== */
function scrSeed(){
  const c=CITIES[S.city];
  ['山','口','人'].forEach(x=>S.known.add(x));
  const seeds=['山','口','人'].map(ch=>{const d=DICT[ch];
    return `<div style="background:var(--ivory); border:1px solid var(--line); padding:14px; text-align:center; flex:1">
      <div class="han" style="font-size:26px; color:var(--navy)">${hanziSpan(ch,true,false)}</div>
      <div style="font-size:9px; color:var(--stone)">${d.pin} · ${d.vi}</div></div>`}).join('');
  return `<div class="scr pad" style="padding-top:24px">
    <div class="eyebrow eb-jade">Ngày 01 · Gieo hạt</div>
    <div class="h2" style="font-size:26px; margin-top:6px">Chưa biết gì?<br>Bắt đầu từ hình.</div>
    <div style="background:var(--navy); padding:24px; margin-top:20px; color:var(--ivory)">
      <div class="eyebrow eb-gold">Cái này trông giống gì?</div>
      <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin:20px 0">
        <span style="font-size:56px">⛰️</span><span style="color:var(--stone)">→</span>
        <span class="han" style="font-size:72px; color:var(--gold)" onclick="speak('山')">山</span></div>
      <div style="text-align:center; font-size:13px"><span class="han">山</span> = núi · <span class="pin" style="color:var(--gold)">shān</span></div>
      <div style="border-top:1px solid var(--jade); margin-top:18px; padding-top:12px; text-align:center;
        font-size:12px; color:var(--jade)">✓ Bạn vừa đọc được chữ Hán đầu tiên</div>

      <div class="eyebrow" style="text-align:center; color:rgba(247,242,234,.7); margin-top:4px">${t.name}</div>
      <div style="display:flex; gap:6px; margin-top:16px">${toneBtns}</div>
      <canvas id="tonecv" width="320" height="140" style="width:100%; height:140px; margin-top:16px"></canvas>
      <div style="display:flex; gap:16px; justify-content:center; font-size:9px; color:var(--stone)">
        <span>┄┄ Mẫu chuẩn</span><span style="color:var(--gold)">━━ Giọng bạn</span></div>
      ${scoreBlock}
    </div>
    <button class="btn btn-red" id="recBtn" onclick="recordTone()" style="margin-top:18px">${recording?'● ĐANG NGHE…':`🎤 NHẤN ĐỂ NÓI '${t.label}'`}</button>
    <div style="font-size:10px; color:var(--stone); margin-top:10px; text-align:center">AI phát hiện cao độ real-time qua autocorrelation.</div>
  </div>`;
}
function pickTone(k){ curTone=k; userContour=null; toneScore=null; render(); }

function autoCorrelate(buf, sampleRate){
  let SIZE=buf.length, rms=0;
  for(let i=0;i<SIZE;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE); if(rms<0.01) return -1;
  let r1=0,r2=SIZE-1,thres=0.2;
  for(let i=0;i<SIZE/2;i++) if(Math.abs(buf[i])<thres){r1=i;break;}
  for(let i=1;i<SIZE/2;i++) if(Math.abs(buf[SIZE-i])<thres){r2=SIZE-i;break;}
  buf=buf.slice(r1,r2); SIZE=buf.length;
  const c=new Array(SIZE).fill(0);
  for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE-i;j++) c[i]+=buf[j]*buf[j+i];
  let d=0; while(d<SIZE-1 && c[d]>c[d+1]) d++;
  let maxv=-1,maxp=-1;
  for(let i=d;i<SIZE;i++) if(c[i]>maxv){maxv=c[i];maxp=i;}
  if(maxp<=0) return -1;
  const f=sampleRate/maxp;
  return (f>70&&f<500)?f:-1;
}
async function recordTone(){
  if(recording)return;
  recording=true; render();
  let frames=[];
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(stream);
    const an=ac.createAnalyser(); an.fftSize=2048; src.connect(an);
    const buf=new Float32Array(an.fftSize); const start=performance.now();
    await new Promise(res=>{(function tick(){
      an.getFloatTimeDomainData(buf);
      const f=autoCorrelate(buf,ac.sampleRate); if(f>0)frames.push(f);
      if(performance.now()-start<1400) requestAnimationFrame(tick); else res();
    })();});
    stream.getTracks().forEach(t=>t.stop()); ac.close(); toneSim=false;
  }catch(e){ toneSim=true; frames=simulateFrames(); }
  finishTone(frames);
}
function simulateFrames(){
  const tc=TONES[curTone].c, out=[];
  for(let i=0;i<40;i++){ const p=i/39*(tc.length-1); const lo=Math.floor(p);
    const v=tc[lo]+(tc[Math.min(lo+1,tc.length-1)]-tc[lo])*(p-lo);
    out.push(120+v*120+(Math.random()-0.5)*22); }
  return out;
}
function finishTone(freqs){
  recording=false;
  freqs=freqs.filter(f=>f>0);
  if(freqs.length<5){ userContour=null; toneScore=0; render(); return; }
  const N=5, bucket=[];
  for(let i=0;i<N;i++){ const a=Math.floor(freqs.length*i/N), b=Math.floor(freqs.length*(i+1)/N);
    const seg=freqs.slice(a,b); bucket.push(seg.reduce((x,y)=>x+y,0)/seg.length); }
  const logs=bucket.map(f=>Math.log2(f)); const mn=Math.min(...logs),mx=Math.max(...logs); const range=mx-mn;
  userContour = range<0.06 ? bucket.map(()=>0.85) : logs.map(l=>(l-mn)/range);
  const tc=TONES[curTone].c; const tVar=variance(tc);
  if(tVar<0.005) toneScore=Math.round(Math.max(0,100-variance(userContour)*900));
  else toneScore=Math.round(Math.max(0,pearson(userContour,tc))*100);
  toneScore=Math.max(0,Math.min(100,toneScore));
  render();
}
function variance(a){ const m=a.reduce((x,y)=>x+y,0)/a.length; return a.reduce((s,v)=>s+(v-m)**2,0)/a.length; }
function pearson(a,b){ const n=a.length; const ma=a.reduce((x,y)=>x+y,0)/n, mb=b.reduce((x,y)=>x+y,0)/n;
  let num=0,da=0,db=0; for(let i=0;i<n;i++){num+=(a[i]-ma)*(b[i]-mb); da+=(a[i]-ma)**2; db+=(b[i]-mb)**2;}
  return (da&&db)?num/Math.sqrt(da*db):0; }
function drawTone(){
  const cv=$('tonecv'); if(!cv)return; const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
  const tc=TONES[curTone].c;
  const toX=i=>20+i/(tc.length-1)*(W-40);
  const toY=v=>H-20-v*(H-40);
  // target dashed
  ctx.setLineDash([10,8]); ctx.strokeStyle='rgba(247,242,234,.5)'; ctx.lineWidth=4; ctx.beginPath();
  tc.forEach((v,i)=>{ const x=toX(i),y=toY(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  // user solid
  if(userContour){ ctx.setLineDash([]); ctx.strokeStyle='#D4B27A'; ctx.lineWidth=5; ctx.lineJoin='round'; ctx.beginPath();
    userContour.forEach((v,i)=>{ const x=toX(i),y=toY(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    ctx.fillStyle='#D4B27A'; userContour.forEach((v,i)=>{ ctx.beginPath(); ctx.arc(toX(i),toY(v),4,0,7); ctx.fill(); });
  }
}

/* ===== 09 DECODE ===== */
function scrDecode(){
  const q=DECODE_QUESTIONS[S.decodeIdx%DECODE_QUESTIONS.length];
  const comps=(DICT[q.char]?.comp||[]).map(c=>`<div style="border:1px solid var(--gold); padding:8px 12px; text-align:center">
    <div class="han" style="color:var(--gold); font-size:22px">${c}</div><div style="font-size:9px; color:var(--stone)">${DICT[c]?.vi||''}</div></div>`).join('<span style="color:var(--gold); font-size:20px">+</span>');
  const opts=q.opts.map((o,i)=>`<div id="dopt${i}" onclick="answerDecode(${i})" style="background:var(--ivory); border:1px solid var(--line); padding:14px; margin-bottom:8px; cursor:pointer; display:flex; align-items:center; gap:12px">
    <span style="width:24px; height:24px; border:1px solid var(--stone); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700">${'ABC'[i]}</span>
    <span style="font-size:14px">${o}</span></div>`).join('');
  return `<div class="scr pad" style="padding-top:24px">
    <div class="eyebrow eb-red">Giải mã · Decoding</div>
    <div class="h2" style="font-size:26px; margin-top:6px">Đoán nghĩa<br>từ bộ thủ</div>
    <div style="background:var(--navy); padding:24px; margin-top:20px; color:var(--ivory)">
      <div class="eyebrow eb-gold" style="text-align:center">Chữ mới</div>
      <div class="han" style="font-size:90px; text-align:center; color:var(--gold)" onclick="speak('${q.char}')">${q.char}</div>
      <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px">${comps}</div>
      <div style="background:rgba(247,242,234,.08); border-left:3px solid var(--gold); padding:12px; margin-top:18px; display:flex; gap:10px; align-items:center">
        <span style="font-size:28px">${MAY('point')}</span>
        <div style="font-size:12px"><b style="color:var(--gold)">MÂY:</b> ${q.hint}</div></div>
    </div>
    <div style="text-align:center; font-size:15px; margin:18px 0">Vậy <span class="han" style="color:var(--red)">${q.char}</span> nghĩa là gì?</div>
    ${opts}
  </div>`;
}
function answerDecode(i){
  const q=DECODE_QUESTIONS[S.decodeIdx%DECODE_QUESTIONS.length];
  const el=$('dopt'+i);
  if(i===q.ans){ el.style.borderColor='var(--jade)'; el.style.background='rgba(45,116,102,.12)';
    S.known.add(q.char); S.xp+=20; toast(`+20 XP · Đọc được ${q.char}`); }
  else{ el.style.borderColor='var(--red)'; el.style.background='rgba(179,58,46,.1)';
    const ok=$('dopt'+q.ans); ok.style.borderColor='var(--jade)'; ok.style.background='rgba(45,116,102,.12)'; }
  setTimeout(()=>{ S.decodeIdx++; render(); },1500);
}

/* ===== 10 PROGRESS ===== */
function scrProgress(){
  const p=pct(S.known.size,COMMON_TARGET);
  const rads=[...S.known].filter(c=>DICT[c]?.rad).length;
  const chars=[...S.known].filter(c=>DICT[c]&&!DICT[c].rad).length;
  const ring=`<svg viewBox="0 0 100 100" style="width:96px; height:96px"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(247,242,234,.15)" stroke-width="8"/><circle cx="50" cy="50" r="42" fill="none" stroke="var(--gold)" stroke-width="8" stroke-dasharray="${p/100*264} 264" stroke-linecap="round" transform="rotate(-90 50 50)"/></svg>`;
  const cityGrid=CITY_ORDER.map(k=>{const cc=CITIES[k]; const got=S.collected.has(k);
    return `<div style="padding:14px; text-align:center; ${got?'background:var(--gold); color:var(--navy)':'background:var(--ivory); border:1px solid var(--line); color:var(--stone)'}">
      <div class="han" style="font-size:20px; color:${got?'var(--red)':'var(--stone)'}">${cc.cn}</div>
      <div style="font-size:11px; font-weight:700">${cc.name}</div>
      <div style="font-size:10px">${S.cityProgress[k]||0}%</div></div>`}).join('');
  const stats=[['🔥 '+S.streak,'Streak'],[S.xp,'XP'],[S.known.size,'Đã thuộc'],[rads,'Bộ thủ'],[chars,'Chữ'],[S.collected.size+'/6','Thành phố']]
    .map(([n,l])=>`<div style="text-align:center; padding:14px 4px"><div class="h2" style="color:var(--gold); font-size:22px">${n}</div><div style="font-size:9px; color:var(--stone); text-transform:uppercase">${l}</div></div>`).join('');
  return `<div class="scr pad" style="padding-top:24px">
    <div class="eyebrow eb-red">Hành trình của bạn</div>
    <div class="h2" style="font-size:24px; margin-top:6px">Bạn đang đọc<br>được bao nhiêu<br>phần thế giới?</div>
    <div style="background:var(--navy); padding:22px; margin-top:18px; color:var(--ivory); display:flex; gap:18px; align-items:center">
      <div style="position:relative">${ring}<div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center"><div class="h2" style="color:var(--gold); font-size:22px">${p}%</div><div style="font-size:8px; color:var(--stone)">thường gặp</div></div></div>
      <div><div class="eyebrow eb-gold">Cấp 3 · Nhà thám hiểm</div>
        <div style="font-size:13px; margin-top:6px">Bạn đọc được ${p}% chữ Hán thường gặp ở 6 thành phố này.</div>
        <div style="font-size:11px; color:var(--stone); margin-top:6px">Mở khóa bộ thủ → tăng %</div></div></div>
    <div class="eyebrow eb-muted" style="margin:20px 0 10px">Bộ sưu tập thành phố</div>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px">${cityGrid}</div>
    <div style="background:var(--navy); display:grid; grid-template-columns:1fr 1fr 1fr; margin-top:18px">${stats}</div>
    <button class="btn btn-ghost" style="color:var(--navy); margin-top:20px" onclick="go('decode')">🧩 Luyện giải mã</button>
  </div>`;
}

/* ===== 5. AI ENGINE i+1 ===== */
async function maybeGenerate(){
  let data=null;
  try{ data=await genLesson(); }catch(e){ console.warn('gen failed, fallback', e); }
  if(!data) data=genLocal();
  // validator: chữ ∈ known ∪ {newChar}
  const valid=[...data.hanzi].every(ch=>S.known.has(ch)||ch===data.newChar);
  if(!valid){ console.warn('validator failed → local'); data=genLocal(); }
  if(!DICT[data.newChar]) DICT[data.newChar]={pin:data.newPin,vi:data.newVi};
  S.known.add(data.newChar);
  S.cityProgress[S.city]=Math.min(99,(S.cityProgress[S.city]||0)+3);
  renderLesson(data); saveState();
}
async function genLesson(){
  // nếu user nhập key riêng → gọi thẳng Anthropic (spec gốc); else → server qwen
  if(CFG.key) return genLLMAnthropic();
  if(S.known.size<ENGINE_THRESHOLD) return null; // dùng template khi vốn còn ít
  return genLLMServer();
}
async function genLLMServer(){
  const c=CITIES[S.city];
  const knownArr=[...S.known].filter(ch=>!DICT[ch]?.rad);
  // /lesson chỉ là bonus — server tự timeout 8s; client chờ tối đa 10s rồi fallback genLocal (UI không treo)
  const ctrl=new AbortController(); const tid=setTimeout(()=>ctrl.abort(),10000);
  try{
    const r=await fetch('/lesson',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({city:c.name,topic:c.topic,known:knownArr.join(''),story:c.story}), signal:ctrl.signal});
    if(!r.ok) throw new Error('server '+r.status);
    const j=await r.json();
    if(j.status!=='success'||!j.data) throw new Error('no data');
    return j.data;
  } finally { clearTimeout(tid); }
}
async function genLLMAnthropic(){
  const c=CITIES[S.city];
  const knownArr=[...S.known].filter(ch=>!DICT[ch]?.rad);
  const prompt=`Bạn là gia sư tiếng Trung cho người Việt. User đang ở thành phố ${c.name} — chủ đề ${c.topic}.
Tạo MỘT câu/cụm tiếng Trung ngắn (3-5 chữ Hán) về chủ đề này.
RÀNG BUỘC TUYỆT ĐỐI: chỉ dùng các chữ Hán trong danh sách ĐÃ BIẾT, CỘNG đúng MỘT chữ Hán mới.
ĐÃ BIẾT: ${knownArr.join('')}
Trả về DUY NHẤT JSON (không giải thích, không markdown fence):
{"hanzi":"...","pinyin":"...","vi":"...","newChar":"...","newPin":"...","newVi":"...","story":"1 câu cảm xúc gợi bối cảnh ${c.name}"}`;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':CFG.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:CFG.model||'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:prompt}]})});
  const j=await r.json(); const text=j.content[0].text; const m=text.match(/\{[\s\S]*\}/);
  if(!m) throw new Error('no JSON'); const data=JSON.parse(m[0]);
  if(!DICT[data.newChar]) DICT[data.newChar]={pin:data.newPin,vi:data.newVi};
  return data;
}
function genLocal(){
  const newPool=["辣","茶","钱","吃","喝","中","国","出","入","小"].filter(c=>!S.known.has(c)&&DICT[c]);
  const nc=newPool[0]||"辣";
  let hanzi,vi;
  if(S.known.has("我")&&S.known.has("爱")){hanzi="我爱"+nc; vi="Tôi thích "+DICT[nc].vi;}
  else if(S.known.has("你")&&S.known.has("好")){hanzi="你好"+nc; vi="Chào "+DICT[nc].vi;}
  else if(S.known.has("火")&&S.known.has("锅")){hanzi="火锅"+nc; vi="Lẩu "+DICT[nc].vi;}
  else{
    // base PHẢI là chữ thật trong known (không hard-code 我) để không vi phạm validator i+1.
    // Ưu tiên 1 bộ thủ tượng hình (có nghĩa rõ) làm ngữ cảnh; nếu known rỗng thì chỉ dùng newChar.
    const base=[...S.known].find(c=>DICT[c]) || "";
    hanzi=base+nc;
    vi=base ? (DICT[base].vi+" · "+DICT[nc].vi) : DICT[nc].vi;
  }
  return { hanzi, pinyin:[...hanzi].map(c=>DICT[c]?.pin||"").join(" "), vi,
    newChar:nc, newPin:DICT[nc].pin, newVi:DICT[nc].vi, story:CITIES[S.city]?.story||"" };
}

/* ===== 8. SETTINGS ===== */
function openSettings(){ $('cfgModel').value=CFG.model||''; $('cfgKey').value=CFG.key||''; $('settingsModal').classList.add('open'); }
function closeSettings(){ $('settingsModal').classList.remove('open'); }
function saveSettings(){
  CFG.model=$('cfgModel').value.trim(); CFG.key=$('cfgKey').value.trim();
  saveCfg(); closeSettings(); toast(CFG.key?'AI key trực tiếp đã bật':'Dùng server qwen / offline');
}

/* ===== MASCOT MÂY (inline SVG emoji-style, editorial) ===== */
function MAY(variant){
  // simple inline representation; designer asset có thể thay sau
  const faces={default:'😊',wonder:'😮',sleep:'😴',point:'👉',walk:'🚶',lantern:'🏮'};
  const f=faces[variant]||faces.default;
  return `<span style="display:inline-block; position:relative">☁️<span style="position:absolute; left:50%; top:55%; transform:translate(-50%,-50%); font-size:.5em">${f}</span></span>`;
}

/* ===== 10. INIT ===== */
(function applyHash(){
  const h=location.hash.slice(1); if(!h)return;
  const p=new URLSearchParams(h);
  const c=p.get('c'); if(c&&CITIES[c])S.city=c;
  const k=p.get('k'); if(k)k.split(',').forEach(ch=>ch&&S.known.add(ch));
  const col=p.get('col'); if(col)col.split(',').forEach(ch=>ch&&S.collected.add(ch));
  const cp=p.get('cp'); if(cp)cp.split(';').forEach(pair=>{const[ct,val]=pair.split(':'); if(ct&&val)S.cityProgress[ct]=parseInt(val);});
  const d=p.get('d'); if(d!=null)S.decodeIdx=parseInt(d);
  const sk=p.get('sk'); if(sk)S.streak=parseInt(sk);
  const xp=p.get('xp'); if(xp)S.xp=parseInt(xp);
  const s=p.get('s'); if(s)S.current=s;
})();
loadState();
if('speechSynthesis'in window) speechSynthesis.getVoices();
render();
