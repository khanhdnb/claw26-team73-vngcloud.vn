<html lang="vi">
<head>

<title>AI ATLAS · 中国之旅</title>
<style>
/* ===== DESIGN SYSTEM (ui_brief) ===== */
:root{
  --navy:#0D1726; --red:#B33A2E; --gold:#D4B27A; --jade:#2D7466;
  --ivory:#F7F2EA; --stone:#8E8576; --line:#E8DFD0;
  --font-disp:"Inter Tight",Inter,-apple-system,system-ui,sans-serif;
  --font-han:"Noto Serif SC",serif;
  --font-body:Inter,-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font-body); background:#1a1a1a; color:var(--ivory);
  display:flex; align-items:center; justify-content:center; min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
/* phone frame */
#phone{
  width:390px; height:844px; max-height:100vh; background:var(--ivory); color:var(--navy);
  position:relative; overflow:hidden; display:flex; flex-direction:column;
  box-shadow:0 20px 70px rgba(0,0,0,.6);
}
@media(max-width:430px){ #phone{ width:100vw; height:100vh; } }
#statusbar{
  height:44px; min-height:44px; display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; font-size:14px; font-weight:600; z-index:50; position:relative;
}
#statusbar .time{font-variant-numeric:tabular-nums}
#statusbar .dots{letter-spacing:1px}
#view{flex:1; overflow-y:auto; overflow-x:hidden; position:relative; -webkit-overflow-scrolling:touch}
#view::-webkit-scrollbar{width:0}
#tabbar{
  height:64px; min-height:64px; display:flex; border-top:1px solid var(--line);
  background:var(--ivory); z-index:50;
}
#tabbar.dark{background:var(--navy); border-top-color:rgba(255,255,255,.08)}
#tabbar button{
  flex:1; border:none; background:none; cursor:pointer; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:3px; font-size:9px; color:var(--stone);
  font-family:var(--font-body); text-transform:uppercase; letter-spacing:.5px;
}
#tabbar button .ic{font-size:18px; line-height:1}
#tabbar button.active{color:var(--red)}
#tabbar.dark button{color:rgba(247,242,234,.45)}
#tabbar.dark button.active{color:var(--gold)}

/* shared atoms */
.eyebrow{font-size:10px; letter-spacing:2.5px; text-transform:uppercase; font-weight:700}
.eb-red{color:var(--red)} .eb-gold{color:var(--gold)} .eb-jade{color:var(--jade)} .eb-muted{color:var(--stone)}
.h2{font-family:var(--font-disp); font-weight:800; letter-spacing:-1px; line-height:1.08}
.han{font-family:var(--font-han); font-weight:700}
.pin{font-style:italic; color:var(--stone); font-weight:500}
.scr{padding:0 0 28px; min-height:100%}
.pad{padding:0 24px}
.btn{
  display:block; width:100%; border:none; cursor:pointer; font-family:var(--font-body);
  font-weight:700; font-size:15px; padding:16px; text-align:center; letter-spacing:.3px;
}
.btn-gold{background:var(--gold); color:var(--navy)}
.btn-red{background:var(--red); color:var(--ivory)}
.btn-ghost{background:transparent; border:1px solid currentColor}
.btn-row{display:flex; gap:10px}
.btn-row .btn{flex:1}
.divider{height:1px; background:var(--line); margin:0}

/* fade-in per screen */
#view > .scr{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* toast */
#toast{
  position:absolute; left:50%; bottom:84px; transform:translateX(-50%) translateY(20px);
  background:var(--navy); color:var(--ivory); font-size:13px; font-weight:600;
  padding:12px 20px; opacity:0; pointer-events:none; transition:.3s; z-index:100;
  border-left:3px solid var(--gold); max-width:80%;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* settings modal */
#settingsModal{
  position:absolute; inset:0; background:rgba(13,23,38,.92); z-index:200;
  display:none; align-items:center; justify-content:center; padding:30px;
}
#settingsModal.open{display:flex}
.modal-card{background:var(--ivory); color:var(--navy); width:100%; padding:26px; }
.modal-card h3{font-family:var(--font-disp); font-size:20px; font-weight:800; margin-bottom:4px}
.modal-card label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px;
  color:var(--stone); margin:16px 0 6px; font-weight:700}
.modal-card input{width:100%; padding:12px; border:1px solid var(--line); font-size:14px;
  font-family:var(--font-body); background:#fff}
.modal-card input:focus{outline:none; border-color:var(--gold)}
.modal-note{font-size:11px; color:var(--stone); margin-top:14px; line-height:1.5}

/* clickable hanzi (audio) */
.hz{font-family:var(--font-han); cursor:pointer}
.hz.known{color:var(--jade)} .hz.newc{color:var(--gold); border-bottom:2px dotted var(--gold)}

/* lesson · mini-quiz feedback */
.qz-opt{transition:background .15s, border-color .15s}
.qz-opt:hover{background:rgba(247,242,234,.10)!important}
.qz-opt.right{background:rgba(45,116,102,.30)!important; border-color:var(--jade)!important; color:#a8e6d4!important}
.qz-opt.wrong{background:rgba(179,58,46,.20)!important; border-color:var(--red)!important; color:#f3b8b0!important}
</style>
</head>

}
function saveState(){
  try{ localStorage.setItem('aiatlas_state', JSON.stringify({
    city:S.city, known:[...S.known], cityProgress:S.cityProgress, collected:[...S.collected],

  })); }catch(e){}
}

function loadCfg(){ try{return JSON.parse(localStorage.getItem('aiatlas_cfg'))||{}}catch(e){return{}} }

/* ===== utils ===== */
const $=id=>document.getElementById(id);
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400); }
function pct(n,d){ return Math.min(99, Math.round(n/d*100)); }
function speak(text){
  if(!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=0.85;
  const v=speechSynthesis.getVoices().find(x=>/zh/i.test(x.lang)); if(v)u.voice=v;

}

/* ===== 3. ROUTER ===== */
const TABS=[
  {s:'atlas',ic:'🗺️',label:'Atlas'}, {s:'lesson',ic:'📖',label:'Học'},
  {s:'decode',ic:'🧩',label:'Giải mã'},
  {s:'tone',ic:'🎵',label:'Phát âm'},
  {s:'progress',ic:'🧭',label:'Hành trình'}
];
const DARK_SCREENS=new Set(['onboard','lesson']);
function render(){
  const v=$('view');
  switch(S.current){
    case 'onboard': v.innerHTML=scrOnboard(); break;
    case 'citypick': v.innerHTML=scrCityPick(); break;
    case 'seed': v.innerHTML=scrSeed(); break;
    case 'atlas': v.innerHTML=scrAtlas(); break;
    case 'citydetail': v.innerHTML=scrCityDetail(); break;
    case 'lesson': v.innerHTML=scrLessonShell(); maybeGenerate(); break;
    case 'tone': v.innerHTML=scrTone(); setTimeout(drawTone,30); break;
    case 'pinyin': v.innerHTML=scrPinyin(); break;
    case 'decode': v.innerHTML=scrDecode(); break;
    case 'progress': v.innerHTML=scrProgress(); break;
  }
  // phone chrome
  const dark=DARK_SCREENS.has(S.current);
  $('phone').style.background = dark?'var(--navy)':'var(--ivory)';
  $('statusbar').style.color = dark?'var(--ivory)':'var(--navy)';
  $('view').style.background = dark?'var(--navy)':'var(--ivory)';
  renderTabbar();
  v.scrollTop=0; saveState();
}
function renderTabbar(){
  const tb=$('tabbar');
  const hide = ['onboard','citypick','seed'].includes(S.current);
  tb.style.display = hide?'none':'flex';
  tb.className = DARK_SCREENS.has(S.current)?'dark':'';
  if(hide){ tb.innerHTML=''; return; }
  tb.innerHTML = TABS.map(t=>{
    // 'pinyin' là nhánh con của tab 'tone' (Phát âm) → cùng active state
    const active = S.current===t.s || (t.s==='tone' && S.current==='pinyin');
    return `<button class="${active?'active':''}" onclick="go('${t.s}')">
       <span class="ic">${t.ic}</span>${t.label}</button>`;
  }).join('');
}
function go(s){
  if(S.current && S.current!==s){
    S.history.push(S.current);
    if(S.history.length>30) S.history.shift();
  }
  S.current=s; render();
}
function goBack(fallback){
  const prev=S.history.pop();
  S.current=prev||fallback||'atlas';
  render();
}

        <span><span style="color:rgba(212,178,122,.4)">●</span> Chưa khám phá</span></div>
    </div>

    <!-- HERO · current city (main focus) -->

      <div onclick="go('citydetail')" style="position:relative; height:200px; cursor:pointer; background:${POSTER(S.city)}; background-size:cover; background-position:center; margin-top:8px; display:flex; align-items:flex-end; overflow:hidden">

  </div>`;
}
function visitCity(k){ S.city=k; if(!S.collected.has(k)){S.collected.add(k); CITIES[k].seed.forEach(c=>S.known.add(c)); S.cityProgress[k]=Math.max(S.cityProgress[k]||0, pct(S.known.size,12));} go('citydetail'); }

/* ===== 05 CITY DETAIL ===== */

    <div class="pad" style="padding-top:20px">

function toneOf(pin){
  if(!pin) return 5;
  const T={1:"āēīōūǖĀĒĪŌŪǕ",2:"áéíóúǘÁÉÍÓÚǗ",3:"ǎěǐǒǔǚǍĚǏǑǓǙ",4:"àèìòùǜÀÈÌÒÙǛ"};

}

function makeQuizOptions(rightVi, newChar){
  const pool=Object.entries(DICT||{}).filter(([ch,e])=>ch!==newChar && e.vi && e.vi!==rightVi).map(([,e])=>e.vi);
  const distractors=[];
  let seed=newChar.charCodeAt(0);
  while(distractors.length<2 && pool.length){
    const i=(seed*(distractors.length+7))%pool.length;
    const pick=pool.splice(i,1)[0];
    if(!distractors.includes(pick)) distractors.push(pick);
  }
  while(distractors.length<2) distractors.push("(khác)");
  const opts=[rightVi,...distractors];
  for(let i=opts.length-1;i>0;i--){ const j=(seed*(i+1))%(i+1); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  return {opts, rightIdx:opts.indexOf(rightVi)};
}
function quizAnswer(idx, rightIdx){
  const opts=document.querySelectorAll('.qz-opt');
  if(!opts.length || opts[0].dataset.done) return;
  opts.forEach(o=>o.dataset.done='1');
  opts[idx].classList.add(idx===rightIdx?'right':'wrong');
  if(idx!==rightIdx) opts[rightIdx].classList.add('right');
  const fb=$('quizFb');
  if(fb){
    if(idx===rightIdx){ S.xp=(S.xp||0)+5; fb.textContent='✓ Chính xác · +5 XP'; fb.style.color='var(--jade)'; }
    else { fb.textContent='✗ Chưa đúng — đáp án đã sáng.'; fb.style.color='#f3b8b0'; }
    saveState&&saveState();
  }
}

function autoCorrelate(buf, sampleRate){
  let SIZE=buf.length, rms=0;
  for(let i=0;i<SIZE;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/SIZE); if(rms<0.01) return -1;
  let r1=0,r2=SIZE-1,thres=0.2;
  for(let i=0;i<SIZE/2;i++) if(Math.abs(buf[i])<thres){r1=i;break;}
  for(let i=1;i<SIZE/2;i++) if(Math.abs(buf[SIZE-i])<thres){r2=SIZE-i;break;}
  buf=buf.slice(r1,r2); SIZE=buf.length;
  const c=new Array(SIZE).fill(0);
  for(let i=0;i<SIZE;i++) for(let j=0;j<SIZE-i;j++) c[i]+=buf[j]*buf[j+i];
  let d=0; while(d<SIZE-1 && c[d]>c[d+1]) d++;
  let maxv=-1,maxp=-1;
  for(let i=d;i<SIZE;i++) if(c[i]>maxv){maxv=c[i];maxp=i;}
  if(maxp<=0) return -1;
  const f=sampleRate/maxp;
  return (f>70&&f<500)?f:-1;
}
async function recordTone(){
  if(recording)return;
  recording=true; render();
  let frames=[];
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(stream);
    const an=ac.createAnalyser(); an.fftSize=2048; src.connect(an);
    const buf=new Float32Array(an.fftSize); const start=performance.now();
    await new Promise(res=>{(function tick(){
      an.getFloatTimeDomainData(buf);
      const f=autoCorrelate(buf,ac.sampleRate); if(f>0)frames.push(f);
      if(performance.now()-start<1400) requestAnimationFrame(tick); else res();
    })();});
    stream.getTracks().forEach(t=>t.stop()); ac.close(); toneSim=false;
  }catch(e){ toneSim=true; frames=simulateFrames(); }
  finishTone(frames);
}
function simulateFrames(){
  const tc=TONES[curTone].c, out=[];
  for(let i=0;i<40;i++){ const p=i/39*(tc.length-1); const lo=Math.floor(p);
    const v=tc[lo]+(tc[Math.min(lo+1,tc.length-1)]-tc[lo])*(p-lo);
    out.push(120+v*120+(Math.random()-0.5)*22); }
  return out;
}
function finishTone(freqs){
  recording=false;
  freqs=freqs.filter(f=>f>0);
  if(freqs.length<5){ userContour=null; toneScore=0; render(); return; }
  const N=5, bucket=[];
  for(let i=0;i<N;i++){ const a=Math.floor(freqs.length*i/N), b=Math.floor(freqs.length*(i+1)/N);
    const seg=freqs.slice(a,b); bucket.push(seg.reduce((x,y)=>x+y,0)/seg.length); }
  const logs=bucket.map(f=>Math.log2(f)); const mn=Math.min(...logs),mx=Math.max(...logs); const range=mx-mn;
  userContour = range<0.06 ? bucket.map(()=>0.85) : logs.map(l=>(l-mn)/range);
  const tc=TONES[curTone].c; const tVar=variance(tc);
  if(tVar<0.005) toneScore=Math.round(Math.max(0,100-variance(userContour)*900));
  else toneScore=Math.round(Math.max(0,pearson(userContour,tc))*100);
  toneScore=Math.max(0,Math.min(100,toneScore));
  render();
}
function variance(a){ const m=a.reduce((x,y)=>x+y,0)/a.length; return a.reduce((s,v)=>s+(v-m)**2,0)/a.length; }
function pearson(a,b){ const n=a.length; const ma=a.reduce((x,y)=>x+y,0)/n, mb=b.reduce((x,y)=>x+y,0)/n;
  let num=0,da=0,db=0; for(let i=0;i<n;i++){num+=(a[i]-ma)*(b[i]-mb); da+=(a[i]-ma)**2; db+=(b[i]-mb)**2;}
  return (da&&db)?num/Math.sqrt(da*db):0; }
function drawTone(){
  const cv=$('tonecv'); if(!cv)return; const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
  const tc=TONES[curTone].c;
  const toX=i=>20+i/(tc.length-1)*(W-40);
  const toY=v=>H-20-v*(H-40);
  // target dashed
  ctx.setLineDash([10,8]); ctx.strokeStyle='rgba(247,242,234,.5)'; ctx.lineWidth=4; ctx.beginPath();
  tc.forEach((v,i)=>{ const x=toX(i),y=toY(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  // user solid
  if(userContour){ ctx.setLineDash([]); ctx.strokeStyle='#D4B27A'; ctx.lineWidth=5; ctx.lineJoin='round'; ctx.beginPath();
    userContour.forEach((v,i)=>{ const x=toX(i),y=toY(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
    ctx.fillStyle='#D4B27A'; userContour.forEach((v,i)=>{ ctx.beginPath(); ctx.arc(toX(i),toY(v),4,0,7); ctx.fill(); });
  }
}

/* ===== 5. AI ENGINE i+1 ===== */
async function maybeGenerate(){
  let data=null;
  try{ data=await genLesson(); }catch(e){ console.warn('gen failed, fallback', e); }
  if(!data) data=genLocal();
  // validator: chữ ∈ known ∪ {newChar}
  const valid=[...data.hanzi].every(ch=>S.known.has(ch)||ch===data.newChar);
  if(!valid){ console.warn('validator failed → local'); data=genLocal(); }
  if(!DICT[data.newChar]) DICT[data.newChar]={pin:data.newPin,vi:data.newVi};
  S.known.add(data.newChar);
  S.cityProgress[S.city]=Math.min(99,(S.cityProgress[S.city]||0)+3);
  renderLesson(data); saveState();
}
async function genLesson(){
  // nếu user nhập key riêng → gọi thẳng Anthropic (spec gốc); else → server qwen
  if(CFG.key) return genLLMAnthropic();
  if(S.known.size<ENGINE_THRESHOLD) return null; // dùng template khi vốn còn ít
  return genLLMServer();
}
async function genLLMServer(){
  const c=CITIES[S.city];
  const knownArr=[...S.known].filter(ch=>!DICT[ch]?.rad);
  // /lesson chỉ là bonus — server tự timeout 8s; client chờ tối đa 10s rồi fallback genLocal (UI không treo)
  const ctrl=new AbortController(); const tid=setTimeout(()=>ctrl.abort(),10000);
  try{
    const r=await fetch('/lesson',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({city:c.name,topic:c.topic,known:knownArr.join(''),story:c.story}), signal:ctrl.signal});
    if(!r.ok) throw new Error('server '+r.status);
    const j=await r.json();
    if(j.status!=='success'||!j.data) throw new Error('no data');
    return j.data;
  } finally { clearTimeout(tid); }
}
async function genLLMAnthropic(){
  const c=CITIES[S.city];
  const knownArr=[...S.known].filter(ch=>!DICT[ch]?.rad);
  const prompt=`Bạn là gia sư tiếng Trung cho người Việt. User đang ở thành phố ${c.name} — chủ đề ${c.topic}.
Tạo MỘT câu/cụm tiếng Trung ngắn (3-5 chữ Hán) về chủ đề này.
RÀNG BUỘC TUYỆT ĐỐI: chỉ dùng các chữ Hán trong danh sách ĐÃ BIẾT, CỘNG đúng MỘT chữ Hán mới.
ĐÃ BIẾT: ${knownArr.join('')}
Trả về DUY NHẤT JSON (không giải thích, không markdown fence):
{"hanzi":"...","pinyin":"...","vi":"...","newChar":"...","newPin":"...","newVi":"...","story":"1 câu cảm xúc gợi bối cảnh ${c.name}"}`;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':CFG.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:CFG.model||'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:prompt}]})});
  const j=await r.json(); const text=j.content[0].text; const m=text.match(/\{[\s\S]*\}/);
  if(!m) throw new Error('no JSON'); const data=JSON.parse(m[0]);
  if(!DICT[data.newChar]) DICT[data.newChar]={pin:data.newPin,vi:data.newVi};
  return data;
}

function genLocal(){
  /* tìm template hợp lệ: newC chưa thuộc + mọi chữ khác đã thuộc + DICT có newC */
  for(const t of SENTENCE_TEMPLATES){
    if(S.known.has(t.newC)) continue;
    if(!DICT[t.newC]) continue;
    const chars=[...t.hz];
    if(chars.indexOf(t.newC)<0) continue;
    const ok=chars.every(ch=>ch===t.newC||S.known.has(ch));
    if(!ok) continue;
    return {
      hanzi:t.hz,
      pinyin:chars.map(c=>DICT[c]?.pin||"").join(" "),
      vi:t.vi,
      newChar:t.newC,
      newPin:DICT[t.newC].pin,
      newVi:DICT[t.newC].vi,
      story:CITIES[S.city]?.story||""
    };
  }
  /* fallback an toàn — không tạo câu giả: chỉ giới thiệu 1 chữ mới đứng riêng kèm 1 chữ đã thuộc làm cảnh */
  const newPool=Object.keys(DICT).filter(c=>!S.known.has(c));
  const nc=newPool[0]||"辣";
  const base=[...S.known].find(c=>DICT[c]);
  const hz=base?base+nc:nc;
  return {
    hanzi:hz,
    pinyin:[...hz].map(c=>DICT[c]?.pin||"").join(" "),
    vi:base?`${DICT[base].vi} + ${DICT[nc].vi} (ghép tự do)`:DICT[nc].vi,
    newChar:nc, newPin:DICT[nc].pin, newVi:DICT[nc].vi,
    story:CITIES[S.city]?.story||""
  };
}
